<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SN Calling CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--brand:#2453d6;--brand-soft:#e9effd;
--green:#15803d;--green-soft:#e7f6ec;--red:#b91c1c;--red-soft:#fdecec;--amber:#b45309;--amber-soft:#fdf3e2;--gray-soft:#f1f2f4;--violet:#6d28d9;--violet-soft:#f1ebfd}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hwrap{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal}
.spacer{flex:1}
.role{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
select,input,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
main{max-width:1180px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--gray-soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.call{background:var(--green);border-color:var(--green);color:#fff;text-decoration:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:12.5px}
h3{margin:0 0 12px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafafb}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-new{background:var(--gray-soft);color:#4b5563}
.s-int{background:var(--green-soft);color:var(--green)}
.s-ni{background:var(--red-soft);color:var(--red)}
.s-cb{background:var(--amber-soft);color:var(--amber)}
.s-na{background:var(--violet-soft);color:var(--violet)}
.s-wn{background:#eceff3;color:#374151}
.s-conv{background:var(--brand-soft);color:var(--brand)}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.bar{height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.lead{padding:14px 16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.lead:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.lead .info{flex:1;min-width:0}
.lead .nm{font-weight:600}
.lead .last{color:var(--mute);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{padding:36px;text-align:center;color:var(--mute)}
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal-bg.show{display:flex}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}
@media(min-width:640px){.modal{border-radius:16px}}
.mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mb{padding:16px 18px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 0 6px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-weight:500;text-align:left;background:#fff}
.out.on{border-color:var(--brand);background:var(--brand-soft)}
textarea{width:100%;min-height:80px;resize:vertical}
.hist{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.hi{padding:8px 0;font-size:13px;border-bottom:1px solid var(--gray-soft)}
.hi:last-child{border-bottom:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:30;font-weight:500}
.toast.show{transform:translateX(-50%) translateY(0)}
.due{background:var(--amber-soft);border-color:#f3dcb5}
.num{font-variant-numeric:tabular-nums}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.live{background:#16a34a;box-shadow:0 0 0 3px #dcfce7}.dot.demo{background:#d97706;box-shadow:0 0 0 3px #fef3c7}.dot.busy{background:var(--brand);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.banner{max-width:1180px;margin:12px auto 0;padding:0 18px}
.banner>div{background:var(--amber-soft);border:1px solid #f3dcb5;color:#7c4a03;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a.btn{text-decoration:none;color:inherit}a.btn.call{color:#fff}
@media(max-width:560px){.lead{flex-wrap:wrap}.lead .acts{width:100%}.lead .acts>*{flex:1;justify-content:center}}
a.lnk{color:var(--brand);text-decoration:none;font-weight:500}
</style>
</head>
<body>
<header><div class="hwrap">
  <div class="logo"><i>☎</i>SN Calling CRM</div>
  <div class="spacer"></div>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Connecting…</span></div>
  <button class="btn sm" id="cfgBtn" style="display:none">⚙ Connect sheet</button>
  <button class="btn sm" id="refresh" title="Reload from Google Sheet">⟳ Refresh</button>
  <a class="btn sm" href="https://docs.google.com/spreadsheets/d/1Aw73vwzpFFdyT08j8BZ4klGE7uamFJwpew7kBCSHLrU/edit" target="_blank" rel="noopener">Open sheet ↗</a>
  <div class="role">Viewing as <select id="who"></select></div>
</div></header>
<div class="banner" id="banner"></div>
<main id="app"></main>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= CONFIG ================= */
const SHEET_ID="1Aw73vwzpFFdyT08j8BZ4klGE7uamFJwpew7kBCSHLrU";
const SRV="Google Sheets";
const OUTCOMES={
  int:{label:"Interested",cls:"s-int"},
  cb:{label:"Call back later",cls:"s-cb"},
  ni:{label:"Not interested",cls:"s-ni"},
  na:{label:"No answer / Busy",cls:"s-na"},
  wn:{label:"Wrong / Switched off",cls:"s-wn"},
  conv:{label:"Converted",cls:"s-conv"},
};
const STATUS={new:{label:"New",cls:"s-new"},...OUTCOMES};
const CODE_BY_LABEL=Object.fromEntries(Object.entries(STATUS).map(([k,v])=>[v.label.toLowerCase(),k]));
const statusCode=l=>CODE_BY_LABEL[String(l||"").trim().toLowerCase()]||"new";

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const toSheetTime=t=>{if(!t)return"";const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function parseT(v){if(v===""||v==null)return null;const m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/);
  if(m)return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]).getTime();const t=Date.parse(v);return isNaN(t)?null:t}
const fmt=t=>{if(!t)return"—";const d=new Date(t);return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"})+", "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})};
const today=t=>t&&new Date(t).toDateString()===new Date().toDateString();
const initials=n=>String(n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
function telHref(p){let d=String(p).replace(/[^\d+]/g,"");if(/^\d{10}$/.test(d))d="+91"+d;return "tel:"+d}
function normPhone(p){const raw=String(p).trim();let d=raw.replace(/\D/g,"");
  if(d.length===12&&d.startsWith("91"))d=d.slice(2);if(d.length===11&&d.startsWith("0"))d=d.slice(1);
  if(d.length===10)return d.slice(0,5)+" "+d.slice(5);return raw.startsWith("+")?"'"+raw:raw}
const pill=s=>`<span class="pill ${STATUS[s].cls}">${STATUS[s].label}</span>`;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2600)};

/* ================= STATE ================= */
let S={employees:[],allEmps:[],leads:[]};
let MODE="loading", BUSY=false, lastSync=null, demoReason="";
let view={who:"admin",tab:"dash",filter:"all",q:"",sel:new Set(),assignFilter:"all",logEmp:"all",logOut:"all"};
const emp=id=>S.allEmps.find(e=>e.id===id);
const empName=id=>id==="ADMIN"?"Admin":(emp(id)?.name||id||"—");

/* ================= GOOGLE SHEETS BACKEND ================= */
let mcp=null;
async function call(tool,input){
  const r=await mcp.callTool(SRV,tool,{spreadsheetId:SHEET_ID,...input},{cache:false});
  let p=r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}
  if(p&&p.content&&p.values===undefined&&typeof p.content==="object"&&!Array.isArray(p.content))p=p.content;
  return p||{};
}
const rows=p=>Array.isArray(p.values)?p.values:[];
function build(eRows,lRows,cRows){
  const allEmps=eRows.map((r,i)=>({id:String(r[0]||"").trim(),name:String(r[1]||"").trim(),phone:String(r[2]??""),active:String(r[3]||"Yes").trim().toLowerCase()!=="no",row:i+2})).filter(e=>e.id&&e.name);
  const findEmp=v=>{v=String(v||"").trim();if(!v)return null;const lv=v.toLowerCase();const e=allEmps.find(e=>e.id.toLowerCase()===lv||e.name.toLowerCase()===lv);return e?e.id:v};
  const leads=lRows.map((r,i)=>({id:String(r[0]||"").trim(),name:String(r[1]||""),phone:String(r[2]??""),city:String(r[3]||""),assignedTo:findEmp(r[4]),
    status:statusCode(r[5]),followUp:parseT(r[6]),lastRemark:String(r[7]||""),lastAt:parseT(r[8]),row:i+2,logs:[]})).filter(l=>l.id||l.name);
  const byId=Object.fromEntries(leads.map(l=>[l.id,l]));
  cRows.forEach(r=>{const l=byId[String(r[2]||"").trim()];if(!l)return;
    l.logs.push({id:r[0],at:parseT(r[1]),by:findEmp(r[5])||"ADMIN",outcome:statusCode(r[7])==="new"?"na":statusCode(r[7]),remark:String(r[8]||""),followUp:parseT(r[9])})});
  leads.forEach(l=>l.logs.sort((a,b)=>(b.at||0)-(a.at||0)));
  return {allEmps,employees:allEmps.filter(e=>e.active),leads};
}
const Live={
  async load(){
    const [e,l,c]=await Promise.all([call("get_values",{range:"Employees!A2:D"}),call("get_values",{range:"Leads!A2:J"}),call("get_values",{range:"CallLogs!A2:J"})]);
    S=build(rows(e),rows(l),rows(c));lastSync=Date.now();
  },
  async logCall(leadId,out,remark,fu,by){
    await this.load();const l=S.leads.find(x=>x.id===leadId);if(!l)throw new Error("Lead not found in sheet – it may have been deleted");
    const now=toSheetTime(Date.now()),label=OUTCOMES[out].label,fuS=toSheetTime(fu);
    await call("append_values",{range:"CallLogs!A1",values:[["C"+Date.now().toString(36).toUpperCase(),now,l.id,l.name,l.phone,by,empName(by),label,remark,fuS]]});
    await call("update_values",{range:`Leads!F${l.row}:I${l.row}`,values:[[label,fuS,remark,now]]});
  },
  async assign(ids,to){
    const p=await call("get_values",{range:"Leads!A2:E"});const R=rows(p);if(!R.length)return;
    const set=new Set(ids);const col=R.map(r=>[set.has(String(r[0]||"").trim())?(to||""):(r[4]??"")]);
    await call("update_values",{range:`Leads!E2:E${R.length+1}`,values:col});
  },
  async addLeads(list){
    await this.load();let max=S.leads.reduce((m,l)=>Math.max(m,parseInt(String(l.id).replace(/\D/g,""))||0),1000);
    const now=toSheetTime(Date.now());
    await call("append_values",{range:"Leads!A1",values:list.map(x=>["L"+(++max),x.name,normPhone(x.phone),x.city||"",x.assignedTo||"","New","","","",now])});
  },
  async addEmp(name,phone){
    await this.load();const max=S.allEmps.reduce((m,e)=>Math.max(m,parseInt(e.id.replace(/\D/g,""))||0),0);
    await call("append_values",{range:"Employees!A1",values:[["E"+(max+1),name,normPhone(phone||""),"Yes"]]});
  },
  async removeEmp(id){
    await this.load();const e=S.allEmps.find(x=>x.id===id);if(!e)return;
    await call("update_values",{range:`Employees!D${e.row}`,values:[["No"]]});
    await this.assign(S.leads.filter(l=>l.assignedTo===id).map(l=>l.id),"");
  }
};

/* ================= APPS SCRIPT BACKEND (GitHub Pages / any website) ================= */
const CFG_KEY="sn-crm-sheet";
function getCfg(){try{return JSON.parse(localStorage.getItem(CFG_KEY))||{}}catch(e){return{}}}
function setCfg(c){try{c?localStorage.setItem(CFG_KEY,JSON.stringify(c)):localStorage.removeItem(CFG_KEY)}catch(e){}}
(function takeSetupLink(){try{const q=new URLSearchParams(location.search);if(q.get("api")&&q.get("key")){setCfg({url:q.get("api"),key:q.get("key")});history.replaceState(null,"",location.pathname+location.hash)}}catch(e){}})();
const Script={
  async req(action,data){const c=getCfg();let r;
    if(action==="load")r=await fetch(c.url+(c.url.includes("?")?"&":"?")+"action=load&key="+encodeURIComponent(c.key));
    else r=await fetch(c.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({key:c.key,action,...data})});
    let j;try{j=await r.json()}catch(e){throw new Error("The Apps Script URL didn't return data – check it's the Web app URL and that access is set to 'Anyone'.")}
    if(!j.ok)throw new Error(j.error||"Request failed");return j},
  async load(){const j=await this.req("load");S=build(j.employees||[],j.leads||[],j.logs||[]);lastSync=Date.now()},
  async logCall(leadId,out,remark,fu,by){await this.req("logCall",{leadId,outcome:OUTCOMES[out].label,remark,followUp:toSheetTime(fu),by,byName:empName(by)})},
  async assign(ids,to){await this.req("assign",{ids,to:to||""})},
  async addLeads(list){await this.req("addLeads",{leads:list.map(x=>({...x,phone:normPhone(x.phone)}))})},
  async addEmp(name,phone){await this.req("addEmp",{name,phone:normPhone(phone||"")})},
  async removeEmp(id){await this.req("removeEmp",{id})}
};
let LIVE=Live;

/* ================= DEMO BACKEND (used when the sheet can't be reached) ================= */
function demoSeed(){
  const H=3600e3,now=Date.now(),T=t=>toSheetTime(t);
  const E=[["E1","Rahul Sharma","98100 11223","Yes"],["E2","Priya Nair","98200 33445","Yes"],["E3","Amit Verma","98300 55667","Yes"]];
  const names=["Ankit Gupta","Sneha Patel","Vikram Singh","Neha Joshi","Rohit Mehta","Pooja Reddy","Arjun Kapoor","Kavya Iyer","Sandeep Yadav","Ritu Malhotra","Manish Jain","Divya Menon","Karan Bhatia","Swati Kulkarni","Rajesh Kumar"];
  const cities=["Delhi","Mumbai","Pune","Bengaluru","Jaipur","Hyderabad","Chennai","Ahmedabad","Lucknow","Kolkata"];
  const L=names.map((n,i)=>["L"+(1001+i),n,"98"+(123+i)+" "+(10000+i*3217),cities[i%10],i<12?"E"+(i%3+1):"","New","","","",""]);
  const C=[];[[0,"Interested","Wants pricing, send brochure on WhatsApp",3],[1,"Call back later","Busy, call after 5 PM",2,2],[2,"Not interested","Already purchased",26],[4,"Converted","Site visit booked Saturday 11 AM",5],[5,"Call back later","Call tomorrow morning",22,-1]]
   .forEach(([i,o,r,ago,fu],k)=>{const l=L[i],at=T(now-ago*H),f=fu!=null?T(now+fu*H):"";C.push(["C"+k,at,l[0],l[1],l[2],l[4],"",o,r,f]);l[5]=o;l[6]=f;l[7]=r;l[8]=at});
  return {E,L,C};
}
let D=demoSeed();
const Demo={
  async load(){S=build(D.E,D.L,D.C)},
  async logCall(leadId,out,remark,fu,by){const r=D.L.find(x=>x[0]===leadId);const now=toSheetTime(Date.now()),lb=OUTCOMES[out].label,f=toSheetTime(fu);
    D.C.push(["C"+Date.now(),now,leadId,r[1],r[2],by,"",lb,remark,f]);r[5]=lb;r[6]=f;r[7]=remark;r[8]=now},
  async assign(ids,to){D.L.forEach(r=>{if(ids.includes(r[0]))r[4]=to||""})},
  async addLeads(list){let m=D.L.length+1001;list.forEach(x=>D.L.push(["L"+(m++),x.name,normPhone(x.phone).replace(/^'/,""),x.city||"",x.assignedTo||"","New","","","",""]))},
  async addEmp(n,p){D.E.push(["E"+(D.E.length+1),n,p,"Yes"])},
  async removeEmp(id){const e=D.E.find(x=>x[0]===id);if(e)e[3]="No";D.L.forEach(r=>{if(r[4]===id)r[4]=""})}
};
const API=()=>MODE==="live"?LIVE:Demo;

/* ================= ERROR HANDLING ================= */
function explain(err){
  const c=err&&err.code;
  if(c==="needs_reauth")return "Your Google Sheets connection has expired. Reconnect Google Sheets in claude.ai → Settings → Connectors, then press Refresh.";
  if(c==="server_not_connected"||c==="selection_required")return "Google Sheets isn't connected for your account. Add it in claude.ai → Settings → Connectors, then press Refresh.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")return "This page needs your permission to use Google Sheets. Press Refresh and choose Allow.";
  if(c==="blocked_by_policy")return "Your organization's policy blocks Google Sheets for this page.";
  if(c==="tool_error")return "Google Sheets refused the request – check that your Google account can edit the sheet. ("+(err.message||"").slice(0,140)+")";
  if(c==="server_unavailable")return "Google Sheets didn't respond. Press Refresh to try again.";
  return (err&&err.message)||"Something went wrong talking to Google Sheets.";
}
async function connect(){
  setSync();
  const inClaude=!!window.claude;
  $("#cfgBtn").style.display=inClaude?"none":"";
  if(!inClaude){
    const c=getCfg();
    if(c.url&&c.key){LIVE=Script;mcp=true;await reload(true);return}
    MODE="demo";demoReason="Not connected to the Google Sheet yet, so you're seeing sample data (changes are not saved). Click ⚙ Connect sheet and paste the Apps Script link + key from your manager.";await Demo.load();render();return}
  try{mcp=await window.claude.use("mcp")}catch(e){mcp=null}
  if(!mcp){MODE="demo";demoReason="Google Sheets isn't available in this view, so you're seeing sample data. Open this page on claude.ai (signed in, with the Google Sheets connector added) to work on the live sheet.";await Demo.load();render();return}
  LIVE=Live;await reload(true);
}
async function reload(first){
  if(!mcp){render();return}
  BUSY=true;setSync();
  try{
    try{await LIVE.load()}catch(e){if(e&&e.retryable){await new Promise(r=>setTimeout(r,(e.retryAfterMs||800)+Math.random()*600));await LIVE.load()}else throw e}
    MODE="live";demoReason="";
  }catch(e){
    if(MODE!=="live"){MODE="demo";await Demo.load()}
    demoReason=explain(e)+(MODE==="demo"?" Showing sample data meanwhile – changes are NOT saved.":"");
  }
  BUSY=false;render();
}
async function write(fn,okMsg){
  if(BUSY)return toast("Please wait – still saving…");
  BUSY=true;setSync();
  try{await fn(API());if(MODE==="live"){await LIVE.load();toast(okMsg+" · saved to Google Sheet ✓")}else{await Demo.load();toast(okMsg+" (demo – not saved)")}BUSY=false;render();return true}
  catch(e){BUSY=false;setSync();toast("Not saved: "+explain(e).slice(0,120));
    // write outcome may be uncertain – re-read to show the truth
    if(MODE==="live")reload();return false}
}
function setSync(){
  const dot=$("#dot"),t=$("#syncTxt");
  dot.className="dot "+(BUSY?"busy":MODE==="live"?"live":MODE==="demo"?"demo":"");
  t.textContent=BUSY?(MODE==="loading"?"Connecting to Google Sheet…":"Syncing…"):MODE==="live"?"Live · Google Sheet · "+new Date(lastSync).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"}):MODE==="demo"?"Demo data":"Connecting…";
  $("#banner").innerHTML=demoReason?`<div>⚠ ${esc(demoReason)}</div>`:"";
}
$("#refresh").onclick=()=>{if(!BUSY)reload()};
setInterval(()=>{if(MODE==="live"&&!BUSY&&document.visibilityState==="visible"&&!$("#mbg").classList.contains("show"))reload()},60000);

function distributePlan(ids){const E=S.employees;const plan={};if(!E.length)return plan;
  const load=Object.fromEntries(E.map(e=>[e.id,S.leads.filter(l=>l.assignedTo===e.id).length]));
  ids.forEach(id=>{const e=E.reduce((a,b)=>load[a.id]<=load[b.id]?a:b);(plan[e.id]=plan[e.id]||[]).push(id);load[e.id]++});return plan}
function bindAdmin(){
  const on=(s,ev,fn)=>{const el=$(s);if(el)el[ev]=fn};
  on("#q","oninput",e=>{view.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)});
  if($("#af")){$("#af").value=view.assignFilter;$("#af").onchange=e=>{view.assignFilter=e.target.value;render()}}
  document.querySelectorAll("[data-sel]").forEach(c=>c.onchange=()=>{c.checked?view.sel.add(c.dataset.sel):view.sel.delete(c.dataset.sel);render()});
  on("#all","onchange",e=>{document.querySelectorAll("[data-sel]").forEach(c=>e.target.checked?view.sel.add(c.dataset.sel):view.sel.delete(c.dataset.sel));render()});
  on("#doAssign","onclick",async()=>{const to=$("#toEmp").value;if(!to)return toast("Choose an employee first");const ids=[...view.sel];
    if(await write(api=>api.assign(ids,to==="__un"?"":to),`${ids.length} lead(s) ${to==="__un"?"unassigned":"assigned to "+empName(to)}`))view.sel.clear(),render()});
  on("#auto","onclick",async()=>{const un=S.leads.filter(l=>!l.assignedTo).map(l=>l.id);if(!un.length)return toast("No unassigned leads");
    const plan=distributePlan(un);await write(async api=>{for(const [eid,ids] of Object.entries(plan))await api.assign(ids,eid)},`${un.length} leads distributed`)});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openLead(b.dataset.open,false));
  on("#addOne","onclick",async()=>{const n=$("#nName").value.trim(),p=$("#nPhone").value.trim();if(!n||!p)return toast("Name and number are required");
    await write(api=>api.addLeads([{name:n,phone:p,city:$("#nCity").value.trim(),assignedTo:$("#nEmp").value}]),"Lead added")});
  on("#doBulk","onclick",async()=>{const lines=$("#bulk").value.split("\n").map(s=>s.trim()).filter(Boolean);const to=$("#bEmp").value;const list=[];
    lines.forEach(ln=>{const p=ln.split(/\t|,/).map(s=>s.trim());if(p.length<2||p[1].replace(/\D/g,"").length<6)return;list.push({name:p[0],phone:p[1],city:p[2]||""})});
    if(!list.length)return toast("No valid lines – use: Name, Number, City");
    if(to==="__auto"){const E=S.employees;const load=Object.fromEntries(E.map(e=>[e.id,S.leads.filter(l=>l.assignedTo===e.id).length]));
      list.forEach(x=>{if(!E.length)return;const e=E.reduce((a,b)=>load[a.id]<=load[b.id]?a:b);x.assignedTo=e.id;load[e.id]++})}
    else list.forEach(x=>x.assignedTo=to);
    if(await write(api=>api.addLeads(list),`${list.length} lead(s) imported`+(lines.length-list.length?`, ${lines.length-list.length} skipped`:""))){view.tab="assign";render()}});
  on("#addEmp","onclick",async()=>{const n=$("#eName").value.trim();if(!n)return toast("Enter a name");await write(api=>api.addEmp(n,$("#ePhone").value.trim()),"Employee added")});
  document.querySelectorAll("[data-del]").forEach(b=>{let armed=false;b.onclick=async()=>{if(!armed){armed=true;b.textContent="Confirm remove?";b.style.color="var(--red)";setTimeout(()=>{armed=false;b.textContent="Remove";b.style.color=""},3000);return}
    await write(api=>api.removeEmp(b.dataset.del),"Employee removed – their leads are now unassigned")}});
  document.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{view.who=b.dataset.as;view.tab="my";render()});
  on("#lEmp","onchange",e=>{view.logEmp=e.target.value;render()});
  on("#lOut","onchange",e=>{view.logOut=e.target.value;render()});
  on("#copyCsv","onclick",async()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const csv=["Date,Employee,Customer,Number,City,Outcome,Remark,Follow-up",...filteredLogs().map(g=>[fmt(g.at),empName(g.by),g.lead.name,g.lead.phone,g.lead.city,OUTCOMES[g.outcome].label,g.remark,g.followUp?fmt(g.followUp):""].map(q).join(","))].join("\n");
    try{await navigator.clipboard.writeText(csv);toast("Copied – paste into Excel")}catch(e){toast("Copy blocked by browser – use Open sheet instead")}});
}

const lastOf=l=>l.logs[0]||(l.lastRemark||l.lastAt?{remark:l.lastRemark,at:l.lastAt}:null);
function renderEmp(){
  const me=emp(view.who);if(!me){view.who="admin";return render()}
  const mine=S.leads.filter(l=>l.assignedTo===me.id);
  const todayCalls=mine.flatMap(l=>l.logs).filter(g=>g.by===me.id&&today(g.at)).length;
  const due=mine.filter(l=>l.status==="cb"&&l.followUp&&l.followUp<=Date.now()+30*60e3);
  const f=view.filter,q=view.q.toLowerCase();
  const list=mine.filter(l=>(f==="all"||l.status===f)&&(!q||(l.name+l.phone+l.city).toLowerCase().includes(q))).sort((a,b)=>(a.status==="new"?0:1)-(b.status==="new"?0:1));
  let h=`<div style="margin-bottom:14px"><div class="mute small">Good day,</div><div style="font-size:20px;font-weight:700">${esc(me.name)}</div></div>
  <div class="stats"><div class="card stat"><span>My leads</span><b>${mine.length}</b></div>
  <div class="card stat"><span>Not yet called</span><b>${mine.filter(l=>l.status==="new").length}</b></div>
  <div class="card stat"><span>Calls today</span><b>${todayCalls}</b></div>
  <div class="card stat"><span>Interested</span><b style="color:var(--green)">${mine.filter(l=>l.status==="int").length}</b></div></div>`;
  if(due.length)h+=`<div class="card due pad" style="margin-bottom:14px"><h3 style="color:var(--amber)">⏰ Callbacks due now (${due.length})</h3>${due.map(l=>leadRow(l)).join("")}</div>`;
  const counts=k=>k==="all"?mine.length:mine.filter(l=>l.status===k).length;
  h+=`<div class="row" style="margin-bottom:10px"><input id="eq" placeholder="Search my leads" value="${esc(view.q)}" style="flex:1;min-width:180px"></div>
  <div class="chips">${["all","new",...Object.keys(OUTCOMES)].map(k=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${k==="all"?"All":STATUS[k].label} · ${counts(k)}</button>`).join("")}</div>
  <div class="card">${list.map(l=>leadRow(l)).join("")||`<div class="empty">No leads here${mine.length?"":" – ask your manager to assign a list"}.</div>`}</div>`;
  $("#app").innerHTML=h;
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{view.filter=b.dataset.f;render()});
  $("#eq").oninput=e=>{view.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#eq");n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll("[data-call]").forEach(a=>a.onclick=()=>{setTimeout(()=>openLead(a.dataset.call,true),400)});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openLead(b.dataset.open,false));

function leadRow(l){
  const last=lastOf(l);
  return `<div class="lead"><div class="av">${initials(l.name)}</div><div class="info">
   <div class="nm">${esc(l.name)} ${pill(l.status)}</div>
   <div class="num" style="margin-top:2px">${esc(l.phone)} <span class="mute small">· ${esc(l.city)}</span></div>
   ${last?`<div class="last">📝 ${esc(last.remark)||"No remark"} · ${fmt(last.at)}${l.status==="cb"&&l.followUp?` · <b style="color:var(--amber)">Callback ${fmt(l.followUp)}</b>`:""}</div>`:""}
  </div><div class="row acts" style="gap:6px;flex-wrap:nowrap">
   <a class="btn call" href="${telHref(l.phone)}" data-call="${esc(l.id)}">📞 Call</a>
   <button class="btn" data-open="${esc(l.id)}">✎ Remark</button></div></div>`;
}

let M={};
function openLead(id,fromCall){
  const l=S.leads.find(x=>x.id===id);if(!l)return;M={id,out:null};
  const isEmp=view.who!=="admin";
  $("#modal").innerHTML=`<div class="mh"><div class="av">${initials(l.name)}</div><div><div style="font-weight:700">${esc(l.name)}</div><div class="num mute small">${esc(l.phone)} · ${esc(l.city)}</div></div><button class="x" id="mx">×</button></div>
  <div class="mb">
   ${fromCall?`<div class="card pad" style="background:var(--green-soft);border-color:#c7e8d2;margin-bottom:6px"><b style="color:var(--green)">📞 Dialing ${esc(l.phone)}…</b><div class="small mute" style="margin-top:3px">Your phone's dialer should open. After the call, record the outcome below. If it didn't open, dial the number shown.</div></div>`:""}
   <div class="row"><a class="btn call" href="${telHref(l.phone)}">📞 Call ${esc(l.phone)}</a><span class="mute small">Assigned to ${esc(l.assignedTo?empName(l.assignedTo):"nobody")}</span></div>
   <label class="f">Call outcome</label>
   <div class="outs">${Object.entries(OUTCOMES).map(([k,o])=>`<button class="out" data-out="${k}"><span class="pill ${o.cls}">${o.label}</span></button>`).join("")}</div>
   <div id="fuWrap" style="display:none"><label class="f">Call back on</label><input type="datetime-local" id="fu" style="width:100%"></div>
   <label class="f">Remark</label><textarea id="rem" placeholder="What did the customer say? e.g. wants quote by Friday, prefers WhatsApp…"></textarea>
   <div class="hist"><b class="small">Call history (${l.logs.length})</b>${l.logs.map(g=>`<div class="hi">${pill(g.outcome)} <span class="mute small">${fmt(g.at)} · ${esc(empName(g.by))}</span><div style="margin-top:4px">${esc(g.remark)||'<span class="mute">No remark</span>'}</div>${g.followUp?`<div class="small" style="color:var(--amber)">Follow-up: ${fmt(g.followUp)}</div>`:""}</div>`).join("")||`<div class="mute small" style="padding:8px 0">No calls yet</div>`}</div>
  </div>
  <div class="mf"><button class="btn" id="mc">Cancel</button><button class="btn pri" id="ms">Save call log</button></div>`;
  $("#mbg").classList.add("show");
  const close=()=>$("#mbg").classList.remove("show");
  $("#mx").onclick=close;$("#mc").onclick=close;
  document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{M.out=b.dataset.out;document.querySelectorAll("[data-out]").forEach(x=>x.classList.toggle("on",x===b));
    $("#fuWrap").style.display=M.out==="cb"?"block":"none";
    if(M.out==="cb"&&!$("#fu").value){const d=new Date(Date.now()+864e5);d.setHours(11,0,0,0);$("#fu").value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T11:00`}});
  $("#ms").onclick=async()=>{if(!M.out)return toast("Select a call outcome");
    const btn=$("#ms");btn.disabled=true;btn.textContent="Saving…";
    const fu=M.out==="cb"&&$("#fu").value?parseT($("#fu").value):null;
    const by=isEmp?view.who:(l.assignedTo||"ADMIN");
    const ok=await write(api=>api.logCall(l.id,M.out,$("#rem").value.trim(),fu,by),"Call logged");
    if(ok)close();else{btn.disabled=false;btn.textContent="Save call log"}};
}
function openCfg(){
  const c=getCfg();
  $("#modal").innerHTML=`<div class="mh"><div style="font-weight:700">Connect to Google Sheet</div><button class="x" id="mx">×</button></div>
  <div class="mb"><p class="small mute" style="margin-top:0">Paste the <b>Apps Script Web app URL</b> and <b>access key</b> from your manager. This is saved on this device only.</p>
   <label class="f">Apps Script Web app URL</label><input id="cUrl" style="width:100%" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(c.url||"")}">
   <label class="f">Access key</label><input id="cKey" style="width:100%" placeholder="Secret key" value="${esc(c.key||"")}">
   ${c.url&&c.key?`<div class="card pad" style="margin-top:14px"><b class="small">Setup link for employees</b><div class="small mute" style="margin:4px 0 8px">Send this link to employees – opening it connects their phone automatically. Share it only with your team.</div><button class="btn sm" id="cLink">⧉ Copy setup link</button></div>`:""}
  </div>
  <div class="mf">${c.url?`<button class="btn" id="cOff" style="margin-right:auto">Disconnect</button>`:""}<button class="btn" id="mc">Cancel</button><button class="btn pri" id="cSave">Save & connect</button></div>`;
  $("#mbg").classList.add("show");const close=()=>$("#mbg").classList.remove("show");
  $("#mx").onclick=close;$("#mc").onclick=close;
  $("#cSave").onclick=async()=>{const url=$("#cUrl").value.trim(),key=$("#cKey").value.trim();
    if(!/^https:\/\/script\.google(usercontent)?\.com\//.test(url))return toast("That doesn't look like an Apps Script Web app URL");if(!key)return toast("Enter the access key");
    setCfg({url,key});close();MODE="loading";demoReason="";render();await connect();if(MODE==="live")toast("Connected to Google Sheet ✓")};
  if($("#cOff"))$("#cOff").onclick=async()=>{setCfg(null);close();await connect();toast("Disconnected")};
  if($("#cLink"))$("#cLink").onclick=async()=>{const u=location.origin+location.pathname+"?api="+encodeURIComponent(c.url)+"&key="+encodeURIComponent(c.key);
    try{await navigator.clipboard.writeText(u);toast("Setup link copied")}catch(e){toast("Copy blocked – link: "+u)}};
}
$("#cfgBtn").onclick=openCfg;
$("#mbg").onclick=e=>{if(e.target.id==="mbg")$("#mbg").classList.remove("show")};

render();connect();
</script>
</body>
</html>
