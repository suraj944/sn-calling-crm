/* ---------- EMPLOYEE VIEW ---------- */
const lastOf=l=>l.logs[0]||(l.lastRemark||l.lastAt?{remark:l.lastRemark,at:l.lastAt}:null);
// Which sections a person's page has: Sales Managers = field work only, Telecaller Executives = leads only, others = both
const pageKind=e=>!e?"both":e.role==="Sales Manager"?"field":e.role==="Telecaller Executive"?"leads":"both";
const showEtabs=()=>!!ME&&view.who!=="admin"&&(view.who===ME.id||isLead())&&pageKind(emp(view.who))==="both";
const etabs=()=>showEtabs()?`<div class="tabs">${(ME&&view.who===ME.id?[["leads","My calls"],["meet","My field work"]]:[["leads","Calls"],["meet","Field work"]]).map(([k,l])=>`<button class="tab ${(view.etab||"leads")===k?"on":""}" data-etab="${k}">${l}</button>`).join("")}</div>`:"";
function bindEtabs(){document.querySelectorAll("[data-etab]").forEach(b=>b.onclick=()=>{view.etab=b.dataset.etab;render()})}
function renderEmp(){
  const me=emp(view.who);if(!me){view.who="admin";return render()}
  if(ME&&pageKind(me)==="field"){view.etab="meet";
    $("#app").innerHTML=(view.who!==ME.id?`<div style="margin-bottom:14px"><div class="mute small">Field work of</div><div style="font-size:20px;font-weight:700">${esc(me.name)}</div></div>`:`<div style="margin-bottom:14px"><div class="mute small">Good day,</div><div style="font-size:20px;font-weight:700">${esc(me.name)} – my field work</div></div>`)+aMeetings();
    bindRange();bindMeetings();bindTips();return}
  if(ME&&pageKind(me)==="leads")view.etab="leads";
  if(showEtabs()&&view.etab==="meet"){$("#app").innerHTML=etabs()+(ME&&view.who!==ME.id?`<div style="margin-bottom:14px"><div class="mute small">Field work of</div><div style="font-size:20px;font-weight:700">${esc(me.name)}</div></div>`:"")+aMeetings();bindEtabs();bindRange();bindMeetings();bindTips();return}
  const mine=S.leads.filter(l=>l.assignedTo===me.id);

/* ---------- FOLLOW-UPS: next follow-up date on lead cases ---------- */
function dayOf(v){const s=String(v||"").trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],m[2]-1,+m[3]).getTime();
  m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);if(m)return new Date(+m[3],m[2]-1,+m[1]).getTime();return null}
const caseActive=c=>{const t=stType(c.Status);return t!=="disb"&&t!=="closed"};
function fuState(c){if(!caseActive(c))return"done";if(!c.fu)return"none";const t=sod(Date.now());return c.fu<t?"over":c.fu===t?"today":c.fu<=t+7*DAY?"week":"later"}
const dShort=t=>new Date(t).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short"});
function fuBadge(c){const s=fuState(c);if(s==="done")return'<span class="mute small">—</span>';
  if(s==="none")return`<span class="fub none" title="No next follow-up date – this case doesn't show in anyone's Today list">Not set</span>`;
  if(s==="over"){const d=Math.round((sod(Date.now())-c.fu)/DAY);return`<span class="fub over">Overdue ${d} day${d===1?"":"s"}</span><div class="small mute num" style="margin-top:2px">${dShort(c.fu)}</div>`}
  if(s==="today")return'<span class="fub today">Today</span>';return`<span class="fub later num">${dShort(c.fu)}</span>`}
const FU_F=[["all","All"],["over","Overdue"],["today","Due today"],["week","Next 7 days"],["none","No date set"]];
const lastLine=c=>String(c.Remarks||"").split(" // ")[0];
function fuTable(list,{tl=true,empty="Nothing here."}={}){
  return `<div class="card tw"><table class="ctab"><tr><th style="width:120px">Follow-up</th><th>Customer</th><th>Product · amount</th><th>Status</th><th>Latest remark</th>${tl?"<th>With</th>":""}<th></th></tr>
   ${list.map(c=>`<tr><td>${fuBadge(c)}</td><td><b>${esc(c["Customer Name"])}</b> <span class="small mute num">${esc(c.code)}</span><div class="small num"><a class="lnk" href="${telHref(c["Contact Number"])}">📞 ${esc(c["Contact Number"])}</a></div></td>

/* ---------- MONTHS, TARGETS & PROGRESS ---------- */
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const monOf=t=>{if(!t)return"";const d=new Date(t);return MONS[d.getMonth()]+"-"+d.getFullYear()};
const curMon=()=>monOf(Date.now());
const monTime=m=>{const[a,y]=String(m).split("-");return new Date(+y,MONS.indexOf(a),1).getTime()};
const monAdd=(m,n)=>{const d=new Date(monTime(m));d.setMonth(d.getMonth()+n);return monOf(d.getTime())};
const monLong=m=>{const d=new Date(monTime(m));return d.toLocaleDateString("en-IN",{month:"long",year:"numeric"})};
const numOf=v=>{const n=parseFloat(String(v==null?"":v).replace(/[^\d.]/g,""));return isFinite(n)?n:0};
const fmtL=n=>!n?"₹0":n>=1e7?"₹"+(n/1e7).toFixed(2).replace(/\.?0+$/,"")+" Cr":n>=1e5?"₹"+(n/1e5).toFixed(1).replace(/\.0$/,"")+" L":"₹"+Math.round(n).toLocaleString("en-IN");
const MET=["Calls","Interested","Cases","Logins","Disbursed cases","Disbursal"];
const isCaller=role=>!["Team Lead","Manager","Admin"].includes(role);
const metIdx=role=>isCaller(role)?[0,1]:[2,3,4,5];
function tgtOf(id,mons){const a=[0,0,0,0,0,0];(S.targets||[]).forEach(r=>{if(r[1]===id&&mons.includes(r[0]))r.slice(3,9).forEach((v,i)=>a[i]+=numOf(v))});return a}
function actOf(id,mons){const a=[0,0,0,0,0,0];mons.forEach(m=>{const r=((S.board||{})[m]||{})[id];if(r)r.forEach((v,i)=>a[i]+=+v||0)});return a}
const metVal=(i,v)=>i===5?fmtL(v):Math.round(v).toLocaleString("en-IN");
// how far through the month we are (to say "on track" or "behind")
function monthPace(m){if(m!==curMon())return 1;const d=new Date(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return d.getDate()/dim}
function progBar(a,t,pace){if(!t)return`<div class="small mute">No target set</div>`;const p=a/t,cls=p>=1?"ok":p>=pace*0.85?"":"low";
  return `<div class="bar ${cls}"><i style="width:${Math.min(100,Math.round(p*100))}%"></i></div><div class="small ${p>=1?"":"mute"}" style="margin-top:3px;${p>=1?"color:var(--green);font-weight:600":""}">${Math.round(p*100)}% ${p>=1?"· target reached 🎉":p>=pace*0.85?"· on track":"· behind pace"}</div>`}
function progressCard(id,role,{title}={}){
  if(!S.board)return"";const m=curMon(),t=tgtOf(id,[m]),a=actOf(id,[m]),ix=metIdx(role),pace=monthPace(m),d=new Date(),dim=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
  return `<div class="card pad" style="margin-bottom:14px"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h3 style="margin:0">${title||"My target – "+monLong(m)}</h3><span class="small mute">Day ${d.getDate()} of ${dim}</span></div>
   <div class="pgrid">${ix.map(i=>`<div><div class="small mute">${MET[i]}</div><div style="font-size:20px;font-weight:700" class="num">${metVal(i,a[i])}${t[i]?`<span class="mute" style="font-size:14px;font-weight:500"> / ${metVal(i,t[i])}</span>`:""}</div>${progBar(a[i],t[i],pace)}</div>`).join("")}</div></div>`}

/* ---------- TODAY: the first screen after login ---------- */
function aToday(){
  const all=CASES(),act=all.filter(caseActive),t0=sod(Date.now()),endT=t0+DAY-1,tlF=view.tdTL||"all";
  const inTL=c=>tlF==="all"||(tlF==="none"?!c["Team Lead"]:c.tlId===tlF||normName(c["Team Lead"])===normName(empName(tlF)));

function perfMonths(){const set=new Set([curMon()]);Object.keys(S.board||{}).forEach(m=>set.add(m));CASES().forEach(c=>{const m=caseMon(c);if(m)set.add(m)});

const periodLabel=p=>{const f=PERIODS.find(x=>x[0]===p);if(p==="cur")return monLong(curMon());if(p==="prev")return monLong(monAdd(curMon(),-1));return f?f[1]:monLong(p)};
// furthest a case got: 0 lead, 1 login, 2 sanction, 3 disbursed
function stageOf(c){if(stType(c.Status)==="disb")return 3;const s=String(c.Status||"").toLowerCase();if(c.sanc||/sanction/.test(s))return 2;if(c.login||/login/.test(s)||/reject/.test(s))return 1;return 0}
const pctS=(a,b)=>b?Math.round(a/b*100)+"%":"—";
function funnelOf(list){const r={n:list.length,l:0,s:0,d:0,amt:0};list.forEach(c=>{const g=stageOf(c);if(g>=1)r.l++;if(g>=2)r.s++;if(g>=3){r.d++;r.amt+=numOf(c["Amount Required"])}});return r}
function groupBy(list,key){const m=new Map();list.forEach(c=>{const k=String(key(c)||"").trim()||"Not recorded";if(!m.has(k))m.set(k,[]);m.get(k).push(c)});return[...m.entries()]}
const DIMS=[["tl","Team Lead",c=>c["Team Lead"]||"Not assigned"],["shared","Lead shared by",c=>c["Lead Shared by"]],["sm","SM Name",c=>c["SM Name"]],["prod","Product",c=>c.Product],["src","Lead source",c=>c["Lead Source"]],["bank","Bank",c=>c["Bank Name"]||"No bank yet"]];

function tatOf(list){return list.filter(c=>stType(c.Status)==="disb"&&c.leadD&&c.disbD).map(c=>({c,d:Math.round((c.disbD-c.leadD)/DAY)})).filter(x=>x.d>=0&&x.d<=1000)}
function perfData(p){
  const ms=periodMonths(p),inP=m=>!ms||ms.includes(m),cases=CASES().filter(c=>inP(caseMon(c))),disb=CASES().filter(c=>stType(c.Status)==="disb"&&inP(disbMon(c)));

  const mons=ms||perfMonths(),one=!!(ms&&ms.length===1);   // targets are monthly: compared only when one month is chosen
  const lb=people.map(e=>{const a=actOf(e.id,mons),t=one?tgtOf(e.id,mons):[0,0,0,0,0,0],ix=metIdx(e.role),withT=ix.filter(i=>t[i]>0);

function monthlySheets(p){
  const D=perfData(p),lbl=periodLabel(p),tAll=D.tat.map(x=>x.d),act=CASES().filter(caseActive);
  const lbRows=(rows,ix)=>[["Rank","Name","Role",...ix.flatMap(i=>[MET[i]+(i===5?" (₹)":""),MET[i]+" target"+(i===5?" (₹)":"")]),"Overall % of target"],
    ...rows.map((e,n)=>[n+1,e.name,e.role,...ix.flatMap(i=>[Math.round(e.a[i]),e.t[i]||""]),e.score==null?"":Math.round(e.score*100)])];
  const fRows=(rows,label)=>[[label,"Cases","Login","Sanction","Disbursed","Disbursed amount (₹)","Case → disbursed %"],...rows.map(r=>[r.k,r.n,r.l,r.s,r.d,Math.round(r.amt),r.n?Math.round(r.d/r.n*100):0])];
  const tRows=(rows,label)=>[[label,"Disbursed cases","Average days","Median days","Fastest","Slowest"],...rows.map(r=>[r.k,r.n,Math.round(r.avg),Math.round(r.med),r.min,r.max])];
  const summary=[["SN Financial Services – monthly report"],["Period",lbl],["Prepared",new Date().toLocaleString("en-IN")],[],
    ["Lead cases",D.f.n],["Logged in at a bank",D.f.l,pctS(D.f.l,D.f.n)],["Sanctioned",D.f.s,pctS(D.f.s,D.f.n)],["Disbursed (of these cases)",D.f.d,pctS(D.f.d,D.f.n)],
    ["Disbursed in the period (any lead date)",D.disb.length],["Disbursed amount in the period (₹)",Math.round(D.disb.reduce((s,c)=>s+numOf(c["Amount Required"]),0))],
    ["Average days lead → disbursal",tAll.length?Math.round(tAll.reduce((s,v)=>s+v,0)/tAll.length):""],["Median days lead → disbursal",tAll.length?Math.round(median(tAll)):""],[],
    ["Follow-ups overdue today",act.filter(c=>fuState(c)==="over").length],["Active cases with no follow-up date",act.filter(c=>fuState(c)==="none").length]];
  return [["Summary",summary],["Team Leads vs target",lbRows(D.leads,[2,3,4,5])],["Telecallers vs target",lbRows(D.callers,[0,1])],
    ["Funnel by Team Lead",fRows(funnelRows(D.cases,"tl"),"Team Lead")],["Funnel by product",fRows(funnelRows(D.cases,"prod"),"Product")],["Funnel by lead source",fRows(funnelRows(D.cases,"src"),"Lead source")],
    ["Funnel by bank",fRows(funnelRows(D.cases,"bank"),"Bank")],
    ["Connectors",fRows(groupBy(D.cases.filter(c=>c["Connector Name"]),c=>c["Connector Name"]).map(([k,l])=>({k,...funnelOf(l)})).sort((a,b)=>b.d-a.d||b.n-a.n),"Connector")],
    ["Days to disbursal – bank",tRows(tatRows(D.tat,c=>c["Bank Name"]||"No bank recorded"),"Bank")],["Days to disbursal – product",tRows(tatRows(D.tat,c=>c.Product||"No product recorded"),"Product")],
    ["Disbursed cases",[["Lead code","Customer","Product","Amount (₹)","Bank","Team Lead","Lead date","Disbursed date","Days"],...D.disb.map(c=>[c.code,c["Customer Name"],c.Product,numOf(c["Amount Required"])||"",c["Bank Name"],c["Team Lead"],c["Lead Date"],c["Disbursed Date"],c.leadD&&c.disbD?Math.round((c.disbD-c.leadD)/DAY):""])]],
    ["Follow-ups overdue",[["Next follow-up","Lead code","Customer","Number","Status","Team Lead","Latest remark"],...act.filter(c=>fuState(c)==="over").sort((a,b)=>a.fu-b.fu).map(c=>[c["Next follow-up"],c.code,c["Customer Name"],c["Contact Number"],c.Status,c["Team Lead"],lastLine(c)])]]];
}
async function monthlyExcel(p){try{toast("Preparing the monthly report…");await loadXLSX();const wb=XLSX.utils.book_new();
  monthlySheets(p).forEach(([n,rows])=>XLSX.utils.book_append_sheet(wb,sheetFrom(rows),n.slice(0,31)));
  const name="SN-CRM_Monthly-report_"+periodLabel(p).replace(/[^A-Za-z0-9]+/g,"-")+".xlsx";XLSX.writeFile(wb,name);toast("Downloaded "+name)}catch(e){toast("Download failed: "+e.message)}}

function readNF(){const v=id=>{const e=$("#nf_"+id);return e?String(e.value).trim():""};const o={};
  document.querySelectorAll("[data-nfh]").forEach(g=>{const on=g.querySelector(".chip.on");o[g.dataset.nfh]=on?on.dataset.v:""});
  [["Lead Type","LeadType"],["Lead Shared by","LeadSharedby"]].forEach(([h,id])=>{if(o[h]===undefined)o[h]=v(id)});
  o["Customer Name"]=v("CustomerName");o["Contact Number"]=v("ContactNumber");o["SM Name"]=v("SMName");o.Product=v("Product");o["Amount Required"]=v("AmountRequired");o["Lead Source"]=v("LeadSource");
  o["Connector Name"]=v("ConnectorName");o["Connector Contact No"]=v("ConnectorContactNo");o["Connector Location"]=v("ConnectorLocation");o.Remarks=v("Remarks");o.to=v("to");return o}

/* ---------- LEAD MODAL (log call / remark) ---------- */
let M={};
function openLead(id,fromCall){
  const l=S.leads.find(x=>x.id===id);if(!l)return;M={id,out:null};$("#modal").style.maxWidth="";
  const withForm=S.srv2&&!caseOf(l.id)&&!!S.handTo&&S.lists&&S.lists["Lead Shared by"],fullF=can("cases");   /* the new server sends the lists the form needs */
  $("#modal").innerHTML=`<div class="mh"><div class="av">${initials(l.name)}</div><div><div style="font-weight:700">${esc(l.name)}</div><div class="num mute small">${esc(l.phone)} · ${esc(l.city)}</div></div><button class="x" id="mx">×</button></div>
  <div class="mb">
   ${fromCall?`<div class="card pad" style="background:var(--green-soft);border-color:#c7e8d2;margin-bottom:6px"><b style="color:var(--green)">📞 Dialing ${esc(l.phone)}…</b><div class="small mute" style="margin-top:3px">Your phone's dialer should open. After the call, record the outcome below.</div></div>`:""}
   <div class="row"><a class="btn call" href="${telHref(l.phone)}">📞 Call ${esc(l.phone)}</a><span class="wawrap"><select id="waT" aria-label="WhatsApp message">${WA_T.map((t,i)=>`<option value="${i}">${esc(t[0])}</option>`).join("")}</select><a class="btn wa" id="waGo" target="_blank" rel="noopener" href="${waHref(l,0)}">WhatsApp</a></span>${isLead()&&can("doAssign")?`<label class="small mute" style="display:flex;gap:6px;align-items:center">Assigned to <select id="mAsg">${l.assignedTo?"":`<option value="" selected disabled>Choose a telecaller…</option>`}${asgOpts(l.assignedTo)}</select></label>`:`<span class="mute small">Assigned to ${esc(l.assignedTo?empName(l.assignedTo):"nobody")}</span>`}</div>
   <label class="f">Call outcome</label>
   <div class="outs">${Object.entries(OUTCOMES).map(([k,o])=>`<button class="out" data-out="${k}"><span class="pill ${o.cls}">${o.label}</span></button>`).join("")}</div>
   <div id="fuWrap" style="display:none"><label class="f">Call back on</label><input type="datetime-local" id="fu" style="width:100%"></div>
   ${withForm?`<div id="lfWrap" style="display:none;margin-top:14px;border:1px solid #d5def3;background:#f8faff;border-radius:14px;padding:14px">${nfHTML({},can("cases"),{inCall:true,name:l.name,phone:l.phone})}</div>`:""}
   <label class="f">Remark</label><textarea id="rem" placeholder="What did the customer say? e.g. wants quote by Friday, prefers WhatsApp…"></textarea>
   <div class="hist"><b class="small">Call history (${l.logs.length})</b>${l.logs.map(g=>`<div class="hi">${pill(g.outcome)} <span class="mute small">${fmt(g.at)} · ${esc(empName(g.by))}</span><div style="margin-top:4px">${esc(g.remark)||'<span class="mute">No remark</span>'}</div>${g.followUp?`<div class="small" style="color:var(--amber)">Follow-up: ${fmt(g.followUp)}</div>`:""}</div>`).join("")||`<div class="mute small" style="padding:8px 0">No calls yet</div>`}</div>
  </div>
  <div class="mf"><button class="btn" id="mc">Cancel</button><button class="btn pri" id="ms">Save call log</button></div>`;
  $("#mbg").classList.add("show");
  const close=()=>$("#mbg").classList.remove("show");
  $("#mx").onclick=close;$("#mc").onclick=close;
  const wt=$("#waT");if(wt)wt.onchange=()=>{$("#waGo").href=waHref(l,+wt.value)};
  const ma=$("#mAsg");if(ma)ma.onchange=async()=>{const to=ma.value;if(!to)return;
    if(!await askOk({title:"Assign this contact?",ok:"Yes, assign",body:`<b>${esc(l.name)}</b> will move to <b>${esc(empName(to))}</b>.`})){ma.value=l.assignedTo||"";return}
    ma.disabled=true;
    const ok=await write(api=>api.assign([l.id],to),`${l.name} assigned to ${empName(to)}`,"Assigning "+l.name+"…");
    if(ok){close();return}ma.value=l.assignedTo||"";ma.disabled=false};
  document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{M.out=b.dataset.out;document.querySelectorAll("[data-out]").forEach(x=>x.classList.toggle("on",x===b));
    $("#fuWrap").style.display=M.out==="cb"?"block":"none";
    const lf=$("#lfWrap");if(lf){lf.style.display=M.out==="int"?"block":"none";$("#ms").textContent=M.out==="int"?(fullF?"Save call & open case":"Save call & send case"):"Save call log";if(M.out==="int")$("#modal").style.maxWidth="760px"}
    if(M.out==="cb"&&!$("#fu").value){const d=new Date(Date.now()+864e5);$("#fu").value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T11:00`}});
  if(withForm)bindNF(fullF);
  $("#ms").onclick=async()=>{if(!M.out)return toast("Select a call outcome");
    if(M.out==="int"&&withForm){const o=readNF(),miss=nfMissing(o,fullF,true);
      if(miss.length){nfMark(miss);return toast("Lead form – please fill in: "+miss.join(", "))}
      if(fullF&&o["Amount Required"]&&!(numOf(o["Amount Required"])>0))return toast("Amount Required should be a number, e.g. 500000");
      const who=o.to?((S.handTo||[]).find(x=>x.id===o.to)||{}).name:"";
      if(!await askOk({title:"Save the call and "+(who?"send":"open")+" the case?",ok:who?"Yes, send case":"Yes, open case",body:nfSummary(o,fullF,who)})){$("#mbg").classList.add("show");return}
      $("#mbg").classList.add("show");const btn=$("#ms"),lbl=btn.textContent;btn.disabled=true;btn.innerHTML=`<span class="spin"></span> Saving…`;const fin=()=>{btn.disabled=false;btn.textContent=lbl};
      const rem=$("#rem").value.trim();let r;showProc("Saving call and opening the case…");
      try{r=await API().logCall(l.id,"int",rem,null,null,o,false)}catch(e){hideProc();fin();if(e&&e.auth)return showLogin(e.message);return toast("Not saved: "+explain(e).slice(0,140))}hideProc();
      if(r&&r.duplicate){const go=await dupAsk(r.duplicate);$("#mbg").classList.add("show");if(!go)return fin();
        if(await write(api=>api.logCall(l.id,"int",rem,null,null,o,true).then(x=>{r=x}),"Call saved","Saving call and opening the case…")){close();toast("Call saved · case "+r.code+(r.to?" sent to "+r.to:" opened"))}else fin();return}
      if(await write(async()=>{},"Call saved · case "+(r&&r.code||"")+(r&&r.to?" sent to "+r.to:" opened"),"Updating…"))close();else fin();return}
    if(M.out==="int"&&!caseOf(l.id)&&S.srv2){const tl=tlOf(l.assignedTo);
      if(!await askOk({title:"Mark as Interested?",ok:"Yes, open case",body:`This opens a lead case for <b>${esc(l.name)}</b>${tl?` and sends it to <b>${esc(tl)}</b>`:" for the Team Lead"} to follow up. After that the telecaller can only view updates.`}))return}
    const btn=$("#ms");btn.disabled=true;btn.innerHTML=`<span class="spin"></span> Saving…`;
    const fu=M.out==="cb"&&$("#fu").value?parseT($("#fu").value):null;
    const by=ME?ME.id:(view.who!=="admin"?view.who:(l.assignedTo||"ADMIN_LOG"));
    const ok=await write(api=>api.logCall(l.id,M.out,$("#rem").value.trim(),fu,by),M.out==="int"&&!caseOf(l.id)&&S.srv2?"Call logged · lead case opened for the Team Lead":"Call logged",M.out==="int"&&!caseOf(l.id)&&S.srv2?"Saving call and opening lead case…":"Saving call…");
    if(ok)close();else{btn.disabled=false;btn.textContent="Save call log"}};
}
$("#mbg").onclick=e=>{if(e.target.id==="mbg")$("#mbg").classList.remove("show")};
$("#cfgBtn").style.display="none";

render();connect();
</script>
</body>
</html>
