<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SN Calling CRM</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--brand:#2453d6;--brand-soft:#e9effd;
--green:#15803d;--green-soft:#e7f6ec;--red:#b91c1c;--red-soft:#fdecec;--amber:#b45309;--amber-soft:#fdf3e2;--gray-soft:#f1f2f4;--violet:#6d28d9;--violet-soft:#f1ebfd}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hwrap{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal}
.spacer{flex:1}
.role{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
select,input,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
main{max-width:1180px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--gray-soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.call{background:var(--green);border-color:var(--green);color:#fff;text-decoration:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:12.5px}
h3{margin:0 0 12px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafafb}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-new{background:var(--gray-soft);color:#4b5563}
.s-int{background:var(--green-soft);color:var(--green)}
.s-ni{background:var(--red-soft);color:var(--red)}
.s-cb{background:var(--amber-soft);color:var(--amber)}
.s-na{background:var(--violet-soft);color:var(--violet)}
.s-wn{background:#eceff3;color:#374151}
.s-conv{background:var(--brand-soft);color:var(--brand)}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.be{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.be{grid-template-columns:1fr}}
.bel{padding:6px}
.bep{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.bep:hover{background:var(--bg)}
.bep.on{background:var(--brand-soft,#eef3ff);border-color:var(--brand)}
.bep .bn{font-weight:600}
.bep .bc{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mute)}
.bep .bc b{color:var(--ink,#111);font-variant-numeric:tabular-nums}
.stats.sm .stat{padding:10px 12px}.stats.sm .stat b{font-size:20px}
.be td.num{white-space:nowrap}.be>*{min-width:0}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.bar{height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.lead{padding:14px 16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.lead:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.lead .info{flex:1;min-width:0}
.lead .nm{font-weight:600}
.lead .last{color:var(--mute);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px}.userchip .av{width:30px;height:30px;font-size:12px}
table.ch{table-layout:fixed;min-width:760px}.rangebar{margin-bottom:14px}.rangebar input[type=month]{padding:5px 8px;margin-left:4px}.rangebar .chips .chip{padding:5px 11px}.rangebar input[type=date]{padding:5px 8px;margin-left:4px}
.dash h3{margin-bottom:10px}
svg.chart{width:100%;height:auto;display:block}svg.chart .grid{stroke:var(--line);stroke-width:1}svg.chart .ax{font-size:11px;fill:var(--mute)}svg.chart .val{font-size:12px;font-weight:600;fill:var(--ink)}svg.chart .bar-m{fill:var(--brand)}
svg.chart rect[data-tip]:hover+*,svg.chart rect[data-tip]:hover{fill:rgba(36,83,214,.06)}
.hbars{display:grid;gap:9px}.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr 44px;align-items:center;gap:10px;font-size:13.5px}
.hb .hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .ht{height:12px;background:var(--gray-soft);border-radius:0 4px 4px 0}.hb .ht i{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.hb .hv{text-align:right;font-variant-numeric:tabular-nums}.hb:hover .ht i{filter:brightness(1.15)}
#tip{position:fixed;display:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:7px;pointer-events:none;z-index:50;white-space:nowrap}
.reports{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}.rep-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.rep h3{margin:0}
.stat .small{margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}.seg button{flex:1;border:0;background:none;padding:8px 6px;font:inherit;font-size:13.5px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.seg-int button.on:first-child{background:var(--green)}.seg-int button.on:last-child{background:var(--red)}
.mform .f{margin-top:12px}.mtable td{vertical-align:middle}.mrow:hover{background:#fafbff}
.modal:has(.mform){max-width:640px}
.mcards{display:none}.mcard{padding:14px;margin-bottom:10px}.mc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mc-tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
@media(max-width:600px){.mcards{display:block;padding-bottom:70px}.card.tw:has(.mtable){display:none}#mAdd{position:fixed;right:16px;bottom:18px;z-index:15;border-radius:999px;padding:14px 20px;box-shadow:0 10px 24px -8px rgba(36,83,214,.6)}.mtable{font-size:13px}}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{padding:36px;text-align:center;color:var(--mute)}
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal-bg.show{display:flex}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}
@media(min-width:640px){.modal{border-radius:16px}}
.mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mb{padding:16px 18px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 0 6px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-weight:500;text-align:left;background:#fff}
.out.on{border-color:var(--brand);background:var(--brand-soft)}
textarea{width:100%;min-height:80px;resize:vertical}
.hist{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.hi{padding:8px 0;font-size:13px;border-bottom:1px solid var(--gray-soft)}
.hi:last-child{border-bottom:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:30;font-weight:500}
.toast.show{transform:translateX(-50%) translateY(0)}
.due{background:var(--amber-soft);border-color:#f3dcb5}
.num{font-variant-numeric:tabular-nums}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.live{background:#16a34a;box-shadow:0 0 0 3px #dcfce7}.dot.demo{background:#d97706;box-shadow:0 0 0 3px #fef3c7}.dot.busy{background:var(--brand);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.banner{max-width:1180px;margin:12px auto 0;padding:0 18px}
.banner>div{background:var(--amber-soft);border:1px solid #f3dcb5;color:#7c4a03;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a.btn{text-decoration:none;color:inherit}a.btn.call{color:#fff}
@media(max-width:560px){.lead{flex-wrap:wrap}.lead .acts{width:100%}.lead .acts>*{flex:1;justify-content:center}}
a.lnk{color:var(--brand);text-decoration:none;font-weight:500}
</style>
</head>
<body>
<header><div class="hwrap">
  <a class="logo" href="../" title="SN Financial Services home" style="text-decoration:none;color:inherit"><i>☎</i>SN Calling CRM</a>
  <div class="spacer"></div>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">Connecting…</span></div>
  <button class="btn sm" id="cfgBtn" style="display:none">⚙ Settings</button>
  <button class="btn sm" id="refresh" title="Reload from Google Sheet">⟳ Refresh</button>
  <a class="btn sm" id="openSheet" style="display:none" href="#" target="_blank" rel="noopener">Open sheet ↗</a>
  <div class="role" id="whoBox">Viewing as <select id="who"></select></div>
  <div id="userBox" class="row" style="gap:6px"></div>
</div></header>
<div class="banner" id="banner"></div>
<main id="app"></main>

<div class="modal-bg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ================= CONFIG ================= */
const SHEET_ID="1Aw73vwzpFFdyT08j8BZ4klGE7uamFJwpew7kBCSHLrU";
const SHEET_URL_DEFAULT="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit";
const SRV="Google Sheets";
// Apps Script Web app URL for this team's sheet. Logins are checked by the Apps Script; no secrets live in this file.
const BUILTIN_API="https://script.google.com/macros/s/AKfycbz9UyLJzPbROL9kSAAmw0R5uG1qQorrEOr24IMOioQVXcIuIBjir9L90cCasmMoGxGn/exec";
const ROLES=["Admin","Manager","Team Lead","Sales Manager","Telecaller Executive"];
const OUTCOMES={
  int:{label:"Interested",cls:"s-int"},
  cb:{label:"Call back later",cls:"s-cb"},
  ni:{label:"Not interested",cls:"s-ni"},
  na:{label:"No answer / Busy",cls:"s-na"},
  wn:{label:"Wrong / Switched off",cls:"s-wn"},
  conv:{label:"Converted",cls:"s-conv"},
};
const STATUS={new:{label:"New",cls:"s-new"},...OUTCOMES};
const CODE_BY_LABEL=Object.fromEntries(Object.entries(STATUS).map(([k,v])=>[v.label.toLowerCase(),k]));
const statusCode=l=>CODE_BY_LABEL[String(l||"").trim().toLowerCase()]||"new";

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const toSheetTime=t=>{if(!t)return"";const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function parseT(v){if(v===""||v==null)return null;const m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/);
  if(m)return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]).getTime();const t=Date.parse(v);return isNaN(t)?null:t}
const fmt=t=>{if(!t)return"—";const d=new Date(t);return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"})+", "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})};
const today=t=>t&&new Date(t).toDateString()===new Date().toDateString();
const initials=n=>String(n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
function telHref(p){let d=String(p).replace(/[^\d+]/g,"");if(/^\d{10}$/.test(d))d="+91"+d;return "tel:"+d}
function normPhone(p){const raw=String(p).trim();let d=raw.replace(/\D/g,"");
  if(d.length===12&&d.startsWith("91"))d=d.slice(2);if(d.length===11&&d.startsWith("0"))d=d.slice(1);
  if(d.length===10)return d.slice(0,5)+" "+d.slice(5);return raw.startsWith("+")?"'"+raw:raw}
const pill=s=>`<span class="pill ${STATUS[s].cls}">${STATUS[s].label}</span>`;
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2800)};
const rank=r=>{const i=ROLES.indexOf(r);return i<0?99:i};

/* ================= STATE ================= */
let S={employees:[],allEmps:[],leads:[]};
let MODE="loading", BUSY=false, lastSync=null, demoReason="";
let ME=null, SHEET_URL="";              // ME is set only for personal logins (website). null = full access (claude.ai / demo)
let view={who:"admin",tab:"dash",filter:"all",q:"",sel:new Set(),assignFilter:"all",logEmp:"all",logOut:"all"};
const emp=id=>S.allEmps.find(e=>e.id===id);
const empName=id=>id==="ADMIN_LOG"?"Admin":(emp(id)?.name||id||"—");
const isLead=()=>!ME||rank(ME.role)<=rank("Team Lead");
const isTL=()=>!!ME&&ME.role==="Team Lead";                 // Team Leads get only their own team from the server
// Teams: a Team Lead + everyone whose "Team Lead" is them. Admin / Manager can filter every page by team.
const teamLeads=(R=RAW||S)=>R.allEmps.filter(e=>e.role==="Team Lead"&&e.active);
const teamOf=e=>!e?"":e.role==="Team Lead"?e.id:(e.tl||"");
const teamName=id=>id==="none"?"No team":(emp(id)?.name||id)+"'s team";
let RAW=null;const SCOPED_TABS=new Set(["dash","lead","byemp","assign","logs","reports"]);
function scopeData(R,t){
  const inT=e=>t==="none"?(!teamOf(e)&&e.role!=="Sales Manager"):teamOf(e)===t;
  const ids=new Set(R.allEmps.filter(inT).map(e=>e.id));
  return {...R,employees:R.employees.filter(e=>ids.has(e.id)),leads:R.leads.filter(l=>ids.has(l.assignedTo)),__scoped:true};
}
const isMgr=()=>!ME||rank(ME.role)<=rank("Manager");
const canManageRole=r=>!ME||ME.role==="Admin"||rank(r)>rank(ME.role);

/* ================= BUILD FROM SHEET ROWS ================= */
function build(eRows,lRows,cRows){
  const allEmps=eRows.map((r,i)=>({id:String(r[0]||"").trim(),name:String(r[1]||"").trim(),phone:String(r[2]??""),
    active:String(r[3]||"Yes").trim().toLowerCase()!=="no",role:ROLES.find(x=>x.toLowerCase()===String(r[4]||"").trim().toLowerCase())||"Telecaller Executive",
    pinSet:!!(String(r[5]||"").trim()||String(r[6]||"").trim()),tlRaw:String(r[6]||"").trim(),row:i+2})).filter(e=>e.id&&e.name);
  allEmps.forEach(e=>{const t=allEmps.find(x=>x.role==="Team Lead"&&x.id===e.tlRaw&&e.role!=="Team Lead");e.tl=t?t.id:"";delete e.tlRaw});
  const findEmp=v=>{v=String(v||"").trim();if(!v)return null;const lv=v.toLowerCase();const e=allEmps.find(e=>e.id.toLowerCase()===lv||e.name.toLowerCase()===lv);return e?e.id:v};
  const leads=lRows.map((r,i)=>({id:String(r[0]||"").trim(),name:String(r[1]||""),phone:String(r[2]??""),city:String(r[3]||""),assignedTo:findEmp(r[4]),
    status:statusCode(r[5]),followUp:parseT(r[6]),lastRemark:String(r[7]||""),lastAt:parseT(r[8]),created:parseT(r[9]),
    source:["Website","Import","Manual"].find(x=>x.toLowerCase()===String(r[10]||"").trim().toLowerCase())||"Import",
    firstRemark:String(r[11]||"")||(/^Website enquiry/.test(String(r[7]||""))?String(r[7]):""),row:i+2,logs:[]})).filter(l=>l.id||l.name);
  const byId=Object.fromEntries(leads.map(l=>[l.id,l]));
  cRows.forEach(r=>{const l=byId[String(r[2]||"").trim()];if(!l)return;
    l.logs.push({id:r[0],at:parseT(r[1]),by:findEmp(r[5])||"ADMIN_LOG",outcome:statusCode(r[7])==="new"?"na":statusCode(r[7]),remark:String(r[8]||""),followUp:parseT(r[9])})});
  leads.forEach(l=>l.logs.sort((a,b)=>(b.at||0)-(a.at||0)));
  return {allEmps,employees:allEmps.filter(e=>e.active),leads};
}

/* ================= BACKEND 1: claude.ai Google Sheets connector ================= */
let mcp=null;
async function call(tool,input){
  const r=await mcp.callTool(SRV,tool,{spreadsheetId:SHEET_ID,...input},{cache:false});
  let p=r.payload;if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}
  if(p&&p.content&&p.values===undefined&&typeof p.content==="object"&&!Array.isArray(p.content))p=p.content;
  return p||{};
}
const rows=p=>Array.isArray(p.values)?p.values:[];
const Live={
  async load(){
    const [e,l,c]=await Promise.all([call("get_values",{range:"Employees!A2:G"}),call("get_values",{range:"'Calling List'!A2:L"}),call("get_values",{range:"CallLogs!A2:J"})]);
    S=build(rows(e),rows(l),rows(c));S.meetings=[];S.meetErr="Field work is available on the website version of the CRM.";lastSync=Date.now();SHEET_URL=SHEET_URL_DEFAULT;
  },
  async logCall(leadId,out,remark,fu,by){
    await this.load();const l=S.leads.find(x=>x.id===leadId);if(!l)throw new Error("Contact not found in sheet – it may have been deleted");
    const now=toSheetTime(Date.now()),label=OUTCOMES[out].label,fuS=toSheetTime(fu);
    await call("append_values",{range:"CallLogs!A1",values:[["C"+Date.now().toString(36).toUpperCase(),now,l.id,l.name,l.phone,by,empName(by),label,remark,fuS]]});
    await call("update_values",{range:`'Calling List'!F${l.row}:I${l.row}`,values:[[label,fuS,remark,now]]});
  },
  async assign(ids,to){
    const p=await call("get_values",{range:"'Calling List'!A2:E"});const R=rows(p);if(!R.length)return;
    const set=new Set(ids);await call("update_values",{range:`'Calling List'!E2:E${R.length+1}`,values:R.map(r=>[set.has(String(r[0]||"").trim())?(to||""):(r[4]??"")])});
  },
  async addLeads(list){
    await this.load();let max=S.leads.reduce((m,l)=>Math.max(m,parseInt(String(l.id).replace(/\D/g,""))||0),1000);const now=toSheetTime(Date.now());
    await call("append_values",{range:"'Calling List'!A1",values:list.map(x=>["L"+(++max),x.name,normPhone(x.phone),x.city||"",x.assignedTo||"","New","","","",now,list.length>1?"Import":"Manual"])});
  },

/* ================= CONNECTION ================= */
function explain(err){
  const c=err&&err.code;
  if(c==="needs_reauth")return "Your Google Sheets connection has expired. Reconnect Google Sheets in claude.ai → Settings → Connectors, then press Refresh.";
  if(c==="server_not_connected"||c==="selection_required")return "Google Sheets isn't connected for your account. Add it in claude.ai → Settings → Connectors, then press Refresh.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")return "This page needs your permission to use Google Sheets. Press Refresh and choose Allow.";
  if(c==="blocked_by_policy")return "Your organization's policy blocks Google Sheets for this page.";
  if(c==="tool_error")return "Google Sheets refused the request – check that your Google account can edit the sheet.";
  if(c==="server_unavailable")return "Google Sheets didn't respond. Press Refresh to try again.";
  if(err&&/Failed to fetch|NetworkError|Load failed/i.test(err.message||""))return "Can't reach the CRM server – check your internet connection and press Refresh.";
  return (err&&err.message)||"Something went wrong talking to Google Sheets.";
}
const websiteMode=()=>!window.claude;
async function connect(){
  setSync();
  if(websiteMode()){
    if(!apiUrl()){MODE="demo";demoReason="This website isn't linked to a Google Sheet yet, so you're seeing sample data (changes are not saved).";await Demo.load();render();return}
    LIVE=Script;mcp=true;
    const a=stored(AUTH_KEY);if(!a||!a.token)return showLogin();
    ME=a.me||null;await reload(true);return;
  }
  try{mcp=await window.claude.use("mcp")}catch(e){mcp=null}
  if(!mcp){MODE="demo";demoReason="Google Sheets isn't available in this view, so you're seeing sample data. Open this page on claude.ai (signed in, with the Google Sheets connector added) to work on the live sheet.";await Demo.load();render();return}
  LIVE=Live;await reload(true);
}
async function reload(){
  if(!mcp){render();return}
  BUSY=true;setSync();
  try{
    try{await LIVE.load()}catch(e){if(e&&e.retryable){await new Promise(r=>setTimeout(r,(e.retryAfterMs||800)+Math.random()*600));await LIVE.load()}else throw e}
    MODE="live";demoReason="";
  }catch(e){
    BUSY=false;
    if(e&&e.auth)return showLogin(e.message);
    if(MODE!=="live"){MODE="demo";await Demo.load()}
    demoReason=explain(e)+(MODE==="demo"?" Showing sample data meanwhile – changes are NOT saved.":"");
  }
  BUSY=false;render();
}

}

/* ================= DATE RANGE (shared by Dashboard & Reports) ================= */
const DAY=864e5;
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const ymd=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const RANGES=[["today","Today"],["yesterday","Yesterday"],["7d","Last 7 days"],["30d","Last 30 days"],["month","This month"],["pickm","Pick month"],["all","All time"],["custom","Custom"]];
if(!view.range)view.range={key:"7d",from:ymd(Date.now()-6*DAY),to:ymd(Date.now())};
if(!view.fwRange)view.fwRange={key:"all",from:ymd(Date.now()-29*DAY),to:ymd(Date.now())};
const onFieldWork=()=>(view.who==="admin"&&view.tab==="meet")||(view.who!=="admin"&&(view.etab==="meet"||(typeof pageKind==="function"&&pageKind(emp(view.who))==="field")));
if(!view.cRange)view.cRange={key:"today",from:ymd(Date.now()-6*DAY),to:ymd(Date.now())};
const curRange=()=>onFieldWork()?view.fwRange:(view.who!=="admin"?view.cRange:view.range);
function rangeBounds(){
  const r=curRange(),t0=sod(Date.now());
  switch(r.key){
    case"today":return[t0,t0+DAY-1];
    case"yesterday":return[t0-DAY,t0-1];
    case"7d":return[t0-6*DAY,t0+DAY-1];
    case"30d":return[t0-29*DAY,t0+DAY-1];
    case"month":{const d=new Date();return[new Date(d.getFullYear(),d.getMonth(),1).getTime(),t0+DAY-1]}
    case"pickm":{const [y,mo]=String(r.month||ymd(Date.now()).slice(0,7)).split("-").map(Number);return[new Date(y,mo-1,1).getTime(),new Date(y,mo,1).getTime()-1]}
    case"all":{const ts=[...S.leads.flatMap(l=>[l.created,...l.logs.map(g=>g.at)]),...(S.meetings||[]).map(m=>m.at)].filter(Boolean);return[ts.length?sod(Math.min(...ts)):t0,t0+DAY-1]}
    default:{const a=parseT(r.from+" 00:00")||t0,b=parseT(r.to+" 00:00")||t0;return[Math.min(a,b),Math.max(a,b)+DAY-1]}
  }
}
const rangeLabel=()=>{const[a,b]=rangeBounds();const f=t=>new Date(t).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"});return sod(a)===sod(b)?f(a):f(a)+" – "+f(b)};
const inRange=t=>{const[a,b]=rangeBounds();return t&&t>=a&&t<=b};
function rangeBar(){
  const r=curRange();
  return `<div class="card pad rangebar"><div class="row">
    <div class="chips" style="margin:0">${RANGES.map(([k,l])=>`<button class="chip ${r.key===k?"on":""}" data-range="${k}">${l}</button>`).join("")}</div>
    ${r.key==="pickm"?`<label class="small mute">Month <input type="month" id="rMonth" value="${esc(r.month||ymd(Date.now()).slice(0,7))}" max="${ymd(Date.now()).slice(0,7)}"></label>`:""}
    ${r.key==="custom"?`<label class="small mute">From <input type="date" id="rFrom" value="${esc(r.from)}" max="${ymd(Date.now())}"></label><label class="small mute">To <input type="date" id="rTo" value="${esc(r.to)}" max="${ymd(Date.now())}"></label>`:""}
    <span class="spacer"></span><span class="small mute" id="rLabel">${esc(rangeLabel())}</span></div></div>`;
}

/* ================= METRICS ================= */
const CONNECTED=o=>o!=="na"&&o!=="wn";
const pct=(a,b)=>b?Math.round(a/b*100):0;
function metrics(){
  const logs=allLogs().filter(g=>inRange(g.at));
  const newLeads=S.leads.filter(l=>inRange(l.created));
  const endToday=sod(Date.now())+DAY-1;
  const byOutcome=Object.fromEntries(Object.keys(OUTCOMES).map(k=>[k,logs.filter(g=>g.outcome===k).length]));
  const people=callers().map(e=>{
    const mine=logs.filter(g=>g.by===e.id),con=mine.filter(g=>CONNECTED(g.outcome)).length;
    const assigned=S.leads.filter(l=>l.assignedTo===e.id);
    return {e,calls:mine.length,connected:con,int:mine.filter(g=>g.outcome==="int").length,conv:mine.filter(g=>g.outcome==="conv").length,
      ni:mine.filter(g=>g.outcome==="ni").length,na:mine.filter(g=>g.outcome==="na"||g.outcome==="wn").length,
      leads:mine.length?new Set(mine.map(g=>g.lead.id)).size:0,gen:leadsIn(assigned).length,assigned:assigned.length,
      untouched:assigned.filter(l=>l.status==="new").length,due:assigned.filter(l=>l.status==="cb"&&l.followUp&&l.followUp<=endToday).length};
  }).sort((a,b)=>b.calls-a.calls||b.conv-a.conv);
  const connected=logs.filter(g=>CONNECTED(g.outcome)).length;
  const leads=leadsIn();
  return {logs,newLeads,leads,byOutcome,people,connected,
    website:newLeads.filter(l=>l.source==="Website").length,
    due:S.leads.filter(l=>l.status==="cb"&&l.followUp&&l.followUp<=endToday).length,
    unassigned:S.leads.filter(l=>!l.assignedTo).length};
}

/* ================= CHART HELPERS (single brand hue, direct labels, hover tooltips) ================= */
function dayBuckets(logs){
  const[a,b]=rangeBounds();const days=Math.round((sod(b)-sod(a))/DAY)+1;
  const byMonth=days>92;const keyOf=t=>byMonth?ymd(t).slice(0,7):ymd(t); // local months (toISOString would shift IST dates into the previous month)
  const buckets=[];
  if(byMonth){const d=new Date(a);d.setDate(1);while(d.getTime()<=b){buckets.push({k:keyOf(d.getTime()),label:d.toLocaleDateString("en-IN",{month:"short",year:"2-digit"}),n:0});d.setMonth(d.getMonth()+1)}}
  else for(let t=sod(a);t<=b;t+=DAY){const d=new Date(t);buckets.push({k:ymd(t),label:d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}),n:0})}
  const idx=Object.fromEntries(buckets.map((x,i)=>[x.k,i]));
  logs.forEach(g=>{const i=idx[keyOf(g.at)];if(i!=null)buckets[i].n++});
  return {buckets,unit:byMonth?"month":"day"};
}
function columnChart(buckets,unit){
  if(!buckets.length)return "";
  const W=640,H=200,pl=34,pr=8,pt=14,pb=26,max=Math.max(1,...buckets.map(b=>b.n));
  const nice=max<=5?5:max<=10?10:Math.ceil(max/5)*5;const iw=W-pl-pr,ih=H-pt-pb,bw=iw/buckets.length,gap=Math.min(6,bw*.25);
  const y=v=>pt+ih-(v/nice)*ih;const every=Math.ceil(buckets.length/8);
  let g=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Calls per ${unit}">`;
  [0,.5,1].forEach(f=>{const v=Math.round(nice*f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl-6}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`});
  const peak=buckets.reduce((m,b,i)=>b.n>buckets[m].n?i:m,0);
  buckets.forEach((b,i)=>{const x=pl+i*bw+gap/2,w=Math.max(2,bw-gap),h=ih-(y(b.n)-pt);
    if(b.n)g+=`<path d="M${x},${pt+ih} v${-(h-Math.min(4,w/2,h))} q0,${-Math.min(4,w/2,h)} ${Math.min(4,w/2)},${-Math.min(4,w/2,h)} h${w-2*Math.min(4,w/2)} q${Math.min(4,w/2)},0 ${Math.min(4,w/2)},${Math.min(4,w/2,h)} v${h-Math.min(4,w/2,h)} z" class="bar-m"/>`;
    g+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(b.label)}: ${b.n} call${b.n===1?"":"s"}"/>`;
    if(i%every===0||i===buckets.length-1)g+=`<text x="${pl+i*bw+bw/2}" y="${H-8}" class="ax" text-anchor="middle">${esc(b.label)}</text>`;
    if(i===peak&&b.n)g+=`<text x="${pl+i*bw+bw/2}" y="${y(b.n)-5}" class="val" text-anchor="middle">${b.n}</text>`});
  return g+`</svg>`;
}
function hbars(rows,{fmtV=v=>v,emptyMsg="No data in this period"}={}){
  const max=Math.max(1,...rows.map(r=>r.v));
  if(!rows.some(r=>r.v))return `<div class="empty small">${emptyMsg}</div>`;
  return `<div class="hbars">${rows.map(r=>`<div class="hb" data-tip="${esc(r.label)}: ${esc(fmtV(r.v))}${r.tip?" – "+esc(r.tip):""}"><span class="hl">${r.pill||esc(r.label)}</span><span class="ht"><i style="width:${Math.max(r.v?2:0,r.v/max*100)}%"></i></span><b class="hv">${esc(fmtV(r.v))}</b></div>`).join("")}</div>`;
}

function rCallLog(){

  return [["Date","Time","Telecaller","Customer","Mobile","City","Outcome","Remark","Follow-up","Contact ID","Source"],
    ...logs.map(g=>{const s=T(g.at);return [s.slice(0,10),s.slice(11),empName(g.by),g.lead.name,g.lead.phone,g.lead.city,OUTCOMES[g.outcome].label,g.remark,T(g.followUp),g.lead.id,g.lead.source]})];
}
function rPerformance(){
  return [["Telecaller","Role","Calls","Connected","Connect rate %","Leads (interested customers)","Interested calls","Converted","Conversion % (of connected)","Not interested","No answer / Wrong no.","Unique customers called","Assigned now","Not yet called","Callbacks due"],
    ...metrics().people.map(p=>[p.e.name,p.e.role,p.calls,p.connected,pct(p.connected,p.calls),p.gen,p.int,p.conv,pct(p.conv,p.connected),p.ni,p.na,p.leads,p.assigned,p.untouched,p.due])];

function rLeads(){

function rEnquiries(){

function fileStamp(){const[a,b]=rangeBounds();return sod(a)===sod(b)?ymd(a):ymd(a)+"_to_"+ymd(b)}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
function toCSV(rows){return "﻿"+rows.map(r=>r.map(v=>{v=String(v??"");if(/^[=+\-@]/.test(v))v="'"+v;return /[",\n]/.test(v)?`"${v.replace(/"/g,'""')}"`:v}).join(",")).join("\r\n")}
let xlsxLoading=null;
function loadXLSX(){if(window.XLSX)return Promise.resolve();return xlsxLoading||(xlsxLoading=new Promise((ok,no)=>{const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";s.onload=ok;s.onerror=()=>{xlsxLoading=null;no(new Error("Couldn't load the Excel library – check your internet or use CSV"))};document.head.appendChild(s)}))}
function sheetFrom(rows){const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=(rows[0]||[]).map((_,i)=>({wch:Math.min(50,Math.max(10,...rows.slice(0,200).map(r=>String(r[i]??"").length+2)))}));return ws}
async function download(k,format){
  const r=REPORTS.find(x=>x.k===k);const base=`SN-CRM_${r.title.replace(/[^A-Za-z]+/g,"-").replace(/-$/,"")}_${fileStamp()}`;
  try{
    if(format==="csv"){downloadBlob(new Blob([toCSV(r.rows())],{type:"text/csv;charset=utf-8"}),base+".csv");toast("Downloaded "+base+".csv");return}
    toast("Preparing Excel file…");await loadXLSX();
    const wb=XLSX.utils.book_new();
    if(k==="full"){
      const sv=view.repLeadsAll;view.repLeadsAll=true;const se=view.repEmp,so=view.repOut;view.repEmp="all";view.repOut="all";
      [["Summary",rSummary()],["Leads",rInterested()],["Telecaller performance",rPerformance()],["Call log",rCallLog()],["Calling list",rLeads()],["Website enquiries",rEnquiries()],["Pending callbacks",rCallbacks()],["Field work",rMeetings()]]
        .forEach(([n,rows])=>XLSX.utils.book_append_sheet(wb,sheetFrom(rows),n));
      view.repLeadsAll=sv;view.repEmp=se;view.repOut=so;
    }else XLSX.utils.book_append_sheet(wb,sheetFrom(r.rows()),r.title.slice(0,31));
    XLSX.writeFile(wb,base+".xlsx");toast("Downloaded "+base+".xlsx");
  }catch(e){toast("Download failed: "+e.message)}
}

const ACR_=new Set(["SBI","HDFC","ICICI","BOM","BOB","PNB","LIC","IDFC","IDBI","UCO","RBL","AU","NBFC","CRM","PSF","PL","BL","HL","LAP","CP","KYC","DSA","LLP","CR","EMI","MD","CEO","GM"]);
const SMALL_=new Set(["of","and","in","for","the","to","at","on","by","with"]);
// Proper case for names ("amit nagdevi" -> "Amit Nagdevi", keeps SBI / HDFC / KR in capitals)
function properName(s){let i=0;return String(s==null?"":s).replace(/\s+/g," ").trim().replace(/[A-Za-z][A-Za-z’']*/g,w=>{const first=i++===0;const core=w.replace(/[’']s$/i,"");
  if(ACR_.has(core.toUpperCase()))return core.toUpperCase()+w.slice(core.length).toLowerCase();if(w===w.toUpperCase()&&w.length<=2)return w;
  if(!first&&SMALL_.has(w.toLowerCase()))return w.toLowerCase();return w[0].toUpperCase()+w.slice(1).toLowerCase()})}
// Tidy free text: capital first letter, "1cr" -> "1 CR"
function tidyText(s){s=String(s==null?"":s).replace(/[ \t]+/g," ").trim().replace(/(\d+(?:\.\d+)?)\s*cr\b/gi,"$1 CR");return s?s[0].toUpperCase()+s.slice(1):s}

      <div><label class="f">${L.sm}</label>${canPickSm?sel("m_sm",S.employees.map(e=>e.name),curSm):`<input value="${esc(curSm)}" disabled style="width:100%">`}</div></div>

function distributePlan(ids){const E=callers().length?callers():S.employees;const plan={};if(!E.length)return plan;
  const load=Object.fromEntries(E.map(e=>[e.id,S.leads.filter(l=>l.assignedTo===e.id).length]));
  ids.forEach(id=>{const e=E.reduce((a,b)=>load[a.id]<=load[b.id]?a:b);(plan[e.id]=plan[e.id]||[]).push(id);load[e.id]++});return plan}

    if(S.employees.some(e=>normName(e.name)===normName(n)))return toast("Someone is already called "+n+" – add a surname or initial");

  document.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{view.who=b.dataset.as;view.tab="my";render()});

  formModal("Change my PIN",`<label class="f">Current PIN</label><input id="fO" type="password" inputmode="numeric" maxlength="4" style="width:100%">
   <label class="f">New PIN (4 digits)</label><input id="fN1" type="password" inputmode="numeric" maxlength="4" style="width:100%">
   <label class="f">Repeat new PIN</label><input id="fN2" type="password" inputmode="numeric" maxlength="4" style="width:100%">`,"Change PIN",async()=>{
    const o=$("#fO").value.trim(),n=$("#fN1").value.trim();if(!validPin(n))return "PIN must be 4 digits";if(n!==$("#fN2").value.trim())return "New PINs don't match";
    try{await Script.changePin(o,n);toast("PIN changed ✓");return true}catch(e){if(e.auth){showLogin(e.message);return true}return e.message}})}

/* ---------- EMPLOYEE VIEW ---------- */
const lastOf=l=>l.logs[0]||(l.lastRemark||l.lastAt?{remark:l.lastRemark,at:l.lastAt}:null);
// Which sections a person's page has: Sales Managers = field work only, Telecaller Executives = leads only, others = both
const pageKind=e=>!e?"both":e.role==="Sales Manager"?"field":e.role==="Telecaller Executive"?"leads":"both";
const showEtabs=()=>!!ME&&view.who!=="admin"&&(view.who===ME.id||isLead())&&pageKind(emp(view.who))==="both";
const etabs=()=>showEtabs()?`<div class="tabs">${(ME&&view.who===ME.id?[["leads","My calls"],["meet","My field work"]]:[["leads","Calls"],["meet","Field work"]]).map(([k,l])=>`<button class="tab ${(view.etab||"leads")===k?"on":""}" data-etab="${k}">${l}</button>`).join("")}</div>`:"";
function bindEtabs(){document.querySelectorAll("[data-etab]").forEach(b=>b.onclick=()=>{view.etab=b.dataset.etab;render()})}
function renderEmp(){
  const me=emp(view.who);if(!me){view.who="admin";return render()}
  if(ME&&pageKind(me)==="field"){view.etab="meet";
    $("#app").innerHTML=(view.who!==ME.id?`<div style="margin-bottom:14px"><div class="mute small">Field work of</div><div style="font-size:20px;font-weight:700">${esc(me.name)}</div></div>`:`<div style="margin-bottom:14px"><div class="mute small">Good day,</div><div style="font-size:20px;font-weight:700">${esc(me.name)} – my field work</div></div>`)+aMeetings();
    bindRange();bindMeetings();bindTips();return}
  if(ME&&pageKind(me)==="leads")view.etab="leads";
  if(showEtabs()&&view.etab==="meet"){$("#app").innerHTML=etabs()+(ME&&view.who!==ME.id?`<div style="margin-bottom:14px"><div class="mute small">Field work of</div><div style="font-size:20px;font-weight:700">${esc(me.name)}</div></div>`:"")+aMeetings();bindEtabs();bindRange();bindMeetings();bindTips();return}
  const mine=S.leads.filter(l=>l.assignedTo===me.id);
  const due=mine.filter(l=>l.status==="cb"&&l.followUp&&l.followUp<=Date.now()+30*60e3);
  const own=ME&&me.id===ME.id;
  // calls this person made in the selected period
  const calls=allLogs().filter(g=>g.by===me.id&&inRange(g.at));
  const con=calls.filter(g=>g.outcome!=="na"&&g.outcome!=="wn").length;
  const oc=k=>calls.filter(g=>g.outcome===k).length;
  const ctab=view.ctab||"leads";
  const myLeadsP=leadsIn(mine),myLeads=mine.filter(isLeadC);
  let h=etabs()+`<div style="margin-bottom:14px"><div class="mute small">${own||!ME?"Good day,":"Viewing the list of"}</div><div style="font-size:20px;font-weight:700">${esc(me.name)}</div></div>`;
  h+=rangeBar();
  h+=`<div class="stats">
  <div class="card stat"><span>Calls made</span><b>${calls.length}</b><div class="small mute">${calls.length?new Set(calls.map(g=>g.lead.id)).size+" different customers":"in this period"}</div></div>
  <div class="card stat"><span>Connected</span><b>${con}</b><div class="small mute">${calls.length?Math.round(con/calls.length*100)+"% of calls":"—"}</div></div>
  <div class="card stat" title="Customers marked Interested (or Converted) – counted on the day they first said they're interested"><span>Leads</span><b style="color:var(--green)">${myLeadsP.length}</b><div class="small mute">interested · ${oc("ni")} not interested</div></div>
  <div class="card stat"><span>Converted</span><b style="color:var(--brand)">${oc("conv")}</b><div class="small mute">${oc("cb")} call back later</div></div>
  <div class="card stat"><span>${own?"My calling list":"Calling list"}</span><b>${mine.length}</b><div class="small mute">${mine.filter(l=>l.status==="new").length} not yet called</div></div>
  <div class="card stat"><span>Callbacks due</span><b style="color:var(--amber)">${due.length}</b><div class="small mute">now</div></div></div>`;
  h+=`<div class="tabs" style="margin-bottom:12px">${[["leads",(own?"My calling list":"Calling list")+" · "+mine.length],["int",(own?"My leads":"Leads")+" · "+myLeads.length],["calls","Call history · "+calls.length]].map(([k,l])=>`<button class="tab ${ctab===k?"on":""}" data-ctab="${k}">${l}</button>`).join("")}</div>`;
  if(ctab==="int"){
    const list=myLeads.slice().sort((a,b)=>(leadAt(b)||0)-(leadAt(a)||0));
    h+=`<div class="small mute" style="margin-bottom:10px">Customers ${own?"you":"they"}'ve marked <b>Interested</b> (or Converted), newest first – all dates.</div>`;
    h+=`<div class="card">${list.map(l=>leadRow(l)).join("")||`<div class="empty">No leads yet – customers marked Interested on a call show up here.</div>`}</div>`;
  }else if(ctab==="calls"){
    const co=view.cOut||"all";const list=calls.filter(g=>co==="all"||g.outcome===co);
    h+=`<div class="row" style="margin-bottom:10px"><select id="cOut"><option value="all">All outcomes</option>${Object.entries(OUTCOMES).map(([k,o])=>`<option value="${k}" ${co===k?"selected":""}>${o.label} · ${oc(k)}</option>`).join("")}</select>
      <span class="mute small">${list.length} call${list.length===1?"":"s"} · ${esc(rangeLabel())}</span></div>`;
    if(!list.length)h+=`<div class="card empty">No calls in this period${curRange().key==="today"?" yet – calls you log today will appear here":" – try another date or month"}.</div>`;
    else{const days={};list.forEach(g=>{const k=ymd(g.at);(days[k]=days[k]||[]).push(g)});
      h+=Object.entries(days).map(([d,gs])=>`<div class="card" style="margin-bottom:12px"><div class="pad" style="padding:10px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between"><b>${new Date(gs[0].at).toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}</b><span class="small mute">${gs.length} call${gs.length===1?"":"s"} · ${gs.filter(g=>g.outcome==="int"||g.outcome==="conv").length} interested/converted</span></div>
        <div class="tw"><table class="ch"><colgroup><col style="width:90px"><col style="width:20%"><col style="width:140px"><col style="width:170px"><col><col style="width:150px"><col style="width:80px"></colgroup><tr><th>Time</th><th>Customer</th><th>Number</th><th>Outcome</th><th>Remark</th><th>Follow-up</th><th></th></tr>
        ${gs.map(g=>`<tr><td class="num small">${new Date(g.at).toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})}</td><td><b>${esc(g.lead.name)}</b><div class="small mute">${esc(g.lead.city)}</div></td>
          <td class="num"><a class="lnk" href="${telHref(g.lead.phone)}">${esc(g.lead.phone)}</a></td><td>${pill(g.outcome)}</td><td class="small" style="max-width:280px">${esc(g.remark)||'<span class="mute">—</span>'}</td>
          <td class="small num">${g.followUp?fmt(g.followUp):"—"}</td><td><button class="btn sm" data-open="${esc(g.lead.id)}">Open</button></td></tr>`).join("")}</table></div></div>`).join("");}
  }else{
    const f=view.filter,q=view.q.toLowerCase();
    const list=mine.filter(l=>(f==="all"||l.status===f)&&(!q||(l.name+l.phone+l.city).toLowerCase().includes(q))).sort((a,b)=>(a.status==="new"?0:1)-(b.status==="new"?0:1));
    if(due.length)h+=`<div class="card due pad" style="margin-bottom:14px"><h3 style="color:var(--amber)">⏰ Callbacks due now (${due.length})</h3>${due.map(l=>leadRow(l)).join("")}</div>`;
    const counts=k=>k==="all"?mine.length:mine.filter(l=>l.status===k).length;
    h+=`<div class="row" style="margin-bottom:10px"><input id="eq" placeholder="Search contacts" value="${esc(view.q)}" style="flex:1;min-width:180px"></div>
    <div class="chips">${["all","new",...Object.keys(OUTCOMES)].map(k=>`<button class="chip ${f===k?"on":""}" data-f="${k}">${k==="all"?"All":STATUS[k].label} · ${counts(k)}</button>`).join("")}</div>
    <div class="card">${list.map(l=>leadRow(l)).join("")||`<div class="empty">No contacts here${mine.length?"":" yet – your manager will assign a list"}.</div>`}</div>`;
  }
  $("#app").innerHTML=h;
  bindEtabs();bindRange();bindTips();
  document.querySelectorAll("[data-ctab]").forEach(b=>b.onclick=()=>{view.ctab=b.dataset.ctab;render()});
  const cs=$("#cOut");if(cs)cs.onchange=()=>{view.cOut=cs.value;render()};
  document.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{view.filter=b.dataset.f;render()});
  const eq=$("#eq");if(eq)eq.oninput=e=>{view.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#eq");n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll("[data-call]").forEach(a=>a.onclick=()=>{setTimeout(()=>openLead(a.dataset.call,true),400)});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openLead(b.dataset.open,false));
}
function leadRow(l){
  const last=lastOf(l);
  return `<div class="lead"><div class="av">${initials(l.name)}</div><div class="info">
   <div class="nm">${esc(l.name)} ${pill(l.status)}</div>
   <div class="num" style="margin-top:2px">${esc(l.phone)} <span class="mute small">· ${esc(l.city)}</span></div>
   ${last?`<div class="last">📝 ${esc(last.remark)||"No remark"} · ${fmt(last.at)}${l.status==="cb"&&l.followUp?` · <b style="color:var(--amber)">Callback ${fmt(l.followUp)}</b>`:""}</div>`:""}
  </div><div class="row acts" style="gap:6px;flex-wrap:nowrap">
   <a class="btn call" href="${telHref(l.phone)}" data-call="${esc(l.id)}">📞 Call</a>
   <button class="btn" data-open="${esc(l.id)}">✎ Remark</button></div></div>`;
}

/* ---------- LEAD MODAL (log call / remark) ---------- */
let M={};
function openLead(id,fromCall){
  const l=S.leads.find(x=>x.id===id);if(!l)return;M={id,out:null};
  $("#modal").innerHTML=`<div class="mh"><div class="av">${initials(l.name)}</div><div><div style="font-weight:700">${esc(l.name)}</div><div class="num mute small">${esc(l.phone)} · ${esc(l.city)}</div></div><button class="x" id="mx">×</button></div>
  <div class="mb">
   ${fromCall?`<div class="card pad" style="background:var(--green-soft);border-color:#c7e8d2;margin-bottom:6px"><b style="color:var(--green)">📞 Dialing ${esc(l.phone)}…</b><div class="small mute" style="margin-top:3px">Your phone's dialer should open. After the call, record the outcome below.</div></div>`:""}
   <div class="row"><a class="btn call" href="${telHref(l.phone)}">📞 Call ${esc(l.phone)}</a>${isLead()?`<label class="small mute" style="display:flex;gap:6px;align-items:center">Assigned to <select id="mAsg">${l.assignedTo?"":`<option value="" selected disabled>Choose a telecaller…</option>`}${asgOpts(l.assignedTo)}</select></label>`:`<span class="mute small">Assigned to ${esc(l.assignedTo?empName(l.assignedTo):"nobody")}</span>`}</div>
   <label class="f">Call outcome</label>
   <div class="outs">${Object.entries(OUTCOMES).map(([k,o])=>`<button class="out" data-out="${k}"><span class="pill ${o.cls}">${o.label}</span></button>`).join("")}</div>
   <div id="fuWrap" style="display:none"><label class="f">Call back on</label><input type="datetime-local" id="fu" style="width:100%"></div>
   <label class="f">Remark</label><textarea id="rem" placeholder="What did the customer say? e.g. wants quote by Friday, prefers WhatsApp…"></textarea>
   <div class="hist"><b class="small">Call history (${l.logs.length})</b>${l.logs.map(g=>`<div class="hi">${pill(g.outcome)} <span class="mute small">${fmt(g.at)} · ${esc(empName(g.by))}</span><div style="margin-top:4px">${esc(g.remark)||'<span class="mute">No remark</span>'}</div>${g.followUp?`<div class="small" style="color:var(--amber)">Follow-up: ${fmt(g.followUp)}</div>`:""}</div>`).join("")||`<div class="mute small" style="padding:8px 0">No calls yet</div>`}</div>
  </div>
  <div class="mf"><button class="btn" id="mc">Cancel</button><button class="btn pri" id="ms">Save call log</button></div>`;
  $("#mbg").classList.add("show");
  const close=()=>$("#mbg").classList.remove("show");
  $("#mx").onclick=close;$("#mc").onclick=close;
  const ma=$("#mAsg");if(ma)ma.onchange=async()=>{const to=ma.value;if(!to)return;ma.disabled=true;
    const ok=await write(api=>api.assign([l.id],to),`${l.name} assigned to ${empName(to)}`);
    if(ok){close();return}ma.value=l.assignedTo||"";ma.disabled=false};
  document.querySelectorAll("[data-out]").forEach(b=>b.onclick=()=>{M.out=b.dataset.out;document.querySelectorAll("[data-out]").forEach(x=>x.classList.toggle("on",x===b));
    $("#fuWrap").style.display=M.out==="cb"?"block":"none";
    if(M.out==="cb"&&!$("#fu").value){const d=new Date(Date.now()+864e5);$("#fu").value=`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T11:00`}});
  $("#ms").onclick=async()=>{if(!M.out)return toast("Select a call outcome");
    const btn=$("#ms");btn.disabled=true;btn.textContent="Saving…";
    const fu=M.out==="cb"&&$("#fu").value?parseT($("#fu").value):null;
    const by=ME?ME.id:(view.who!=="admin"?view.who:(l.assignedTo||"ADMIN_LOG"));
    const ok=await write(api=>api.logCall(l.id,M.out,$("#rem").value.trim(),fu,by),"Call logged");
    if(ok)close();else{btn.disabled=false;btn.textContent="Save call log"}};
}
$("#mbg").onclick=e=>{if(e.target.id==="mbg")$("#mbg").classList.remove("show")};
$("#cfgBtn").style.display="none";

render();connect();
</script>
</body>
</html>
