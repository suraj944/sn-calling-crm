<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SN Calling CRM</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%22-20%200%20104%20104%22%3E%3Cdefs%3E%3Crect%20id%3D%22t%22%20x%3D%22-21%22%20y%3D%22-21%22%20width%3D%2242%22%20height%3D%2242%22%20rx%3D%223%22%20transform%3D%22translate%2832%2032%29%20rotate%2845%29%22/%3E%3Crect%20id%3D%22b%22%20x%3D%22-21%22%20y%3D%22-21%22%20width%3D%2242%22%20height%3D%2242%22%20rx%3D%2213%22%20transform%3D%22translate%2832%2070%29%20rotate%2845%29%22/%3E%3CclipPath%20id%3D%22c%22%3E%3Cuse%20href%3D%22%23t%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cuse%20href%3D%22%23b%22%20fill%3D%22%23FFD93D%22/%3E%3Cuse%20href%3D%22%23t%22%20fill%3D%22%23FFE352%22/%3E%3Cuse%20href%3D%22%23b%22%20fill%3D%22%23F6C81C%22%20clip-path%3D%22url%28%23c%29%22/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#16181d;--mute:#6b7280;--line:#e5e7eb;--brand:#2453d6;--brand-soft:#e9effd;
--green:#15803d;--green-soft:#e7f6ec;--red:#b91c1c;--red-soft:#fdecec;--amber:#b45309;--amber-soft:#fdf3e2;--gray-soft:#f1f2f4;--violet:#6d28d9;--violet-soft:#f1ebfd}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.hmenu{display:contents}#menuBtn,.lg-short{display:none}
@media(max-width:640px){   /* phones: one compact row; the rest sits in the ☰ menu */
 .hwrap{padding:8px 12px;gap:8px;flex-wrap:nowrap;position:relative}.logo{font-size:15px}.lg-full{display:none}.lg-short{display:inline}
 #syncTxt{display:none}.rt{display:none}#refresh,#menuBtn{min-width:38px;justify-content:center}#menuBtn{display:inline-flex;font-size:16px}
 .hmenu{display:none}
 header.open .hmenu{display:flex;flex-direction:column;align-items:stretch;gap:12px;position:absolute;left:0;right:0;top:100%;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 10px 24px rgba(16,24,40,.12);padding:14px 16px 16px}
 header.open .hmenu .role{flex-direction:column;align-items:stretch;gap:4px}header.open .hmenu .role select{width:100%}
 header.open .hmenu #userBox{flex-wrap:wrap;gap:8px}header.open .hmenu #userBox .userchip{flex:1;min-width:0}
 header.open .hmenu #openSheet{justify-content:center}
 header.open #menuBtn{background:var(--brand-soft);border-color:var(--brand);color:var(--brand)}
}
.hwrap{max-width:1600px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px}
.logo i{width:30px;height:30px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-style:normal}
.logo .mk{width:20px;height:32px;display:block;flex:none}.lg-full{display:flex;flex-direction:column;line-height:1.1}.lg-full b{font-size:15px;font-weight:700;letter-spacing:-.01em}.lg-full small{font-size:11px;font-weight:500;color:var(--mute);letter-spacing:.02em}
.brandmk{background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%20104%22%3E%3Cdefs%3E%3Crect%20id%3D%22t%22%20x%3D%22-21%22%20y%3D%22-21%22%20width%3D%2242%22%20height%3D%2242%22%20rx%3D%223%22%20transform%3D%22translate%2832%2032%29%20rotate%2845%29%22/%3E%3Crect%20id%3D%22b%22%20x%3D%22-21%22%20y%3D%22-21%22%20width%3D%2242%22%20height%3D%2242%22%20rx%3D%2213%22%20transform%3D%22translate%2832%2070%29%20rotate%2845%29%22/%3E%3CclipPath%20id%3D%22c%22%3E%3Cuse%20href%3D%22%23t%22/%3E%3C/clipPath%3E%3C/defs%3E%3Cuse%20href%3D%22%23b%22%20fill%3D%22%23FFD93D%22/%3E%3Cuse%20href%3D%22%23t%22%20fill%3D%22%23FFE352%22/%3E%3Cuse%20href%3D%22%23b%22%20fill%3D%22%23F6C81C%22%20clip-path%3D%22url%28%23c%29%22/%3E%3C/svg%3E") center/contain no-repeat}
@media(max-width:640px){.logo .lg-full{display:none}.logo .mk{width:18px;height:29px}}
.spacer{flex:1}
.role{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13px}
select,input,textarea{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;outline:none}
select:focus,input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
main{max-width:1600px;margin:0 auto;padding:18px}
.tabs{display:flex;gap:4px;margin-bottom:16px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{padding:10px 14px;border:0;background:none;cursor:pointer;color:var(--mute);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tab.on{color:var(--brand);border-color:var(--brand)}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--gray-soft)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.call{background:var(--green);border-color:var(--green);color:#fff;text-decoration:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px}
.pad{padding:16px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{padding:14px 16px}
.stat b{display:block;font-size:24px;margin-top:4px;font-variant-numeric:tabular-nums}
.stat span{color:var(--mute);font-size:12.5px}
h3{margin:0 0 12px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.03em;padding:10px 12px;border-bottom:1px solid var(--line);background:#fafafb}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}
/* Lead Cases table: Open button column stays pinned on the right, long remarks cut to 2 lines */
.ctab th:last-child,.ctab td:last-child{position:sticky;right:0;background:#fff;box-shadow:-6px 0 8px -6px rgba(0,0,0,.12);white-space:nowrap}
.ctab .clip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pill{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.s-new{background:var(--gray-soft);color:#4b5563}
.s-int{background:var(--green-soft);color:var(--green)}
.s-ni{background:var(--red-soft);color:var(--red)}
.s-cb{background:var(--amber-soft);color:var(--amber)}
.s-na{background:var(--violet-soft);color:var(--violet)}
.s-wn{background:#eceff3;color:#374151}
.s-nc{background:#e3f3f1;color:#0f6b62}
.wawrap{display:inline-flex;gap:0;align-items:stretch}.wawrap select{border-radius:10px 0 0 10px;border-right:0;max-width:150px}.btn.wa{background:#25D366;color:#073b1c;border-color:#25D366;border-radius:0 10px 10px 0;font-weight:700}.btn.wa:hover{background:#1ebe5a}
.stat.act span{white-space:nowrap}
.s-conv{background:var(--brand-soft);color:var(--brand)}
.mute{color:var(--mute)}
.small{font-size:12.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 12px;margin:6px 0 4px}@media(max-width:760px){.cgrid{grid-template-columns:1fr 1fr}}
.be{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:900px){.be{grid-template-columns:1fr}}
.bel{padding:6px}
.bep{display:block;width:100%;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.bep:hover{background:var(--bg)}
.bep.on{background:var(--brand-soft,#eef3ff);border-color:var(--brand)}
.bep .bn{font-weight:600}
.bep .bc{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--mute)}
.bep .bc b{color:var(--ink,#111);font-variant-numeric:tabular-nums}
.stats.sm .stat{padding:10px 12px}.stats.sm .stat b{font-size:20px}
.be td.num{white-space:nowrap}.be>*{min-width:0}
@media(max-width:820px){.grid2{grid-template-columns:1fr}}
.bar{height:8px;background:var(--gray-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.lead{padding:14px 16px;display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--line)}
.lead:last-child{border-bottom:0}
.av{width:40px;height:40px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:none}
.lead .info{flex:1;min-width:0}
.lead .nm{font-weight:600}
.lead .last{color:var(--mute);font-size:12.5px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;cursor:pointer;font-size:13px}
.userchip{display:flex;align-items:center;gap:8px;font-size:13px}.userchip .av{width:30px;height:30px;font-size:12px}
table.ch{table-layout:fixed;min-width:760px}.rangebar{margin-bottom:14px}.rangebar input[type=month]{padding:5px 8px;margin-left:4px}.rangebar .chips .chip{padding:5px 11px}.rangebar input[type=date]{padding:5px 8px;margin-left:4px}
.dash h3{margin-bottom:10px}
svg.chart{width:100%;height:auto;display:block}svg.chart .grid{stroke:var(--line);stroke-width:1}svg.chart .ax{font-size:11px;fill:var(--mute)}svg.chart .val{font-size:12px;font-weight:600;fill:var(--ink)}svg.chart .bar-m{fill:var(--brand)}
svg.chart rect[data-tip]:hover+*,svg.chart rect[data-tip]:hover{fill:rgba(36,83,214,.06)}
.hbars{display:grid;gap:9px}.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr 44px;align-items:center;gap:10px;font-size:13.5px}
.hb .hl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hb .ht{height:12px;background:var(--gray-soft);border-radius:0 4px 4px 0}.hb .ht i{display:block;height:100%;background:var(--brand);border-radius:0 4px 4px 0}
.hb .hv{text-align:right;font-variant-numeric:tabular-nums}.hb:hover .ht i{filter:brightness(1.15)}
#tip{position:fixed;display:none;background:var(--ink);color:#fff;font-size:12.5px;padding:6px 9px;border-radius:7px;pointer-events:none;z-index:50;white-space:nowrap}
.reports{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}.rep-h{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.rep h3{margin:0}
.stat .small{margin-top:3px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0 14px}
@media(max-width:560px){.g2,.g3{grid-template-columns:1fr}}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}.seg button{flex:1;border:0;background:none;padding:8px 6px;font:inherit;font-size:13.5px;cursor:pointer;border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}.seg button.on{background:var(--brand);color:#fff;font-weight:600}
.seg-int button.on:first-child{background:var(--green)}.seg-int button.on:last-child{background:var(--red)}
.mform .f{margin-top:12px}.mtable td{vertical-align:middle}.mrow:hover{background:#fafbff}
.modal:has(.mform){max-width:640px}
.mcards{display:none}.mcard{padding:14px;margin-bottom:10px}.mc-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.mc-tags{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 4px}
@media(max-width:600px){.mcards{display:block;padding-bottom:70px}.card.tw:has(.mtable){display:none}#mAdd{position:fixed;right:16px;bottom:18px;z-index:15;border-radius:999px;padding:14px 20px;box-shadow:0 10px 24px -8px rgba(36,83,214,.6)}.mtable{font-size:13px}}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.empty{padding:36px;text-align:center;color:var(--mute)}
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal-bg.show{display:flex}
/* confirmation pop-up (sits above the case / contact window) */
.cfm-bg{position:fixed;inset:0;background:rgba(17,24,39,.5);display:none;align-items:center;justify-content:center;z-index:40;padding:16px}
.cfm-bg.show{display:flex}
.cfm{background:#fff;border-radius:14px;max-width:440px;width:100%;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.cfm-h{font-weight:700;font-size:16px;padding:16px 18px 6px}
.cfm-b{padding:0 18px 14px;color:#374151;line-height:1.5}
.cfm-b ul{margin:6px 0 0;padding-left:18px}.cfm-b li{margin:3px 0}
.cfm-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
.perm{display:flex;gap:8px;align-items:center;padding:6px 9px;font-size:13px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.perm em{margin-left:auto;font-style:normal;font-size:11px;color:var(--mute)}.perm.off{opacity:.55;cursor:not-allowed}
/* permissions window: title and buttons stay put, only the list scrolls */
.pmw{display:flex;flex-direction:column;max-height:92vh}.pmw>.mb{overflow:auto;flex:1;min-height:0}
.pmf{flex-wrap:wrap;align-items:center}.pmf .sp{flex:1}
@media(max-width:520px){.pmf .btn{flex:1}.pmf .sp{display:none}#pdef{flex-basis:100%}}
.pgrid.pgrid3{grid-template-columns:repeat(3,minmax(0,1fr))}@media(max-width:560px){.pgrid.pgrid3{grid-template-columns:1fr}}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}@media(max-width:560px){.pgrid{grid-template-columns:1fr}}.pgrp+.pgrp{margin-top:16px}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
@media(min-width:640px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}
@media(min-width:640px){.modal{border-radius:16px}}
.mh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
.mb{padding:16px 18px}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.x{margin-left:auto;border:0;background:none;font-size:22px;cursor:pointer;color:var(--mute)}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin:12px 0 6px}
.outs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.out{border:1.5px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;font-weight:500;text-align:left;background:#fff}
.out.on{border-color:var(--brand);background:var(--brand-soft)}
textarea{width:100%;min-height:80px;resize:vertical}
.hist{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px}
.hi{padding:8px 0;font-size:13px;border-bottom:1px solid var(--gray-soft)}
.hi:last-child{border-bottom:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;transition:.25s;z-index:30;font-weight:500}
.toast.show{transform:translateX(-50%) translateY(0)}
.due{background:var(--amber-soft);border-color:#f3dcb5}
.num{font-variant-numeric:tabular-nums}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}
.sync{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute)}
.dot{width:8px;height:8px;border-radius:50%;background:#9ca3af;display:inline-block}
.dot.live{background:#16a34a;box-shadow:0 0 0 3px #dcfce7}.dot.demo{background:#d97706;box-shadow:0 0 0 3px #fef3c7}.dot.busy{background:var(--brand);animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.banner{max-width:1600px;margin:12px auto 0;padding:0 18px}
.banner>div{background:var(--amber-soft);border:1px solid #f3dcb5;color:#7c4a03;border-radius:10px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
a.btn{text-decoration:none;color:inherit}a.btn.call{color:#fff}
@media(max-width:560px){.lead{flex-wrap:wrap}.lead .acts{width:100%}.lead .acts>*{flex:1;justify-content:center}}
a.lnk{color:var(--brand);text-decoration:none;font-weight:500}
/* ---------- loading states ---------- */
.topbar{position:fixed;left:0;right:0;top:0;height:3px;z-index:60;overflow:hidden;opacity:0;transition:opacity .2s;pointer-events:none}
body.working .topbar{opacity:1}
.topbar::before{content:"";position:absolute;top:0;bottom:0;left:-40%;width:40%;background:var(--brand);border-radius:2px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{left:-40%}100%{left:100%}}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;vertical-align:-2px;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
#refresh.spinning{pointer-events:none;opacity:.75}#refresh.spinning .ri{display:inline-block;animation:rot .8s linear infinite}
.boot{max-width:520px;margin:9vh auto 0;text-align:center}
.boot .bl{width:40px;height:64px;margin:0 auto 16px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(36,83,214,.35)}50%{transform:scale(1.04);box-shadow:0 0 0 14px rgba(36,83,214,0)}}
.boot h2{margin:0 0 4px;font-size:20px}.boot .bt{color:var(--mute);min-height:22px}
.boot .bar{height:6px;background:#e5e9f2;border-radius:6px;overflow:hidden;margin:18px auto 0;max-width:320px;position:relative}
.boot .bar i{position:absolute;inset:0 auto 0 0;background:var(--brand);border-radius:6px;transition:width .6s ease}
.boot .slow{margin-top:14px;font-size:13px;color:#b26a00;display:none}
.skel{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:40px;text-align:left}
.skel div{height:84px;border-radius:12px;background:linear-gradient(90deg,#eceff4 25%,#f6f7fa 37%,#eceff4 63%);background-size:400% 100%;animation:shim 1.4s ease infinite}
@keyframes shim{0%{background-position:100% 50%}100%{background-position:0 50%}}
/* processing pop-up while something is being saved / removed / assigned */
.proc-bg{position:fixed;inset:0;z-index:55;background:rgba(245,246,248,.6);backdrop-filter:blur(1.5px);display:none;align-items:center;justify-content:center;padding:16px}
.proc-bg.show{display:flex;animation:fadein .15s ease}
.proc{background:#fff;border-radius:14px;box-shadow:0 18px 50px rgba(0,0,0,.18);padding:18px 22px;display:flex;gap:14px;align-items:center;min-width:280px;max-width:420px}
.proc b{font-size:15px}.spin.big{width:28px;height:28px;border-width:3px;color:var(--brand);flex:none}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.topbar::before,.spin,#refresh.spinning .ri,.boot .bl,.skel div{animation:none}}
.fub{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.fub.over{background:#fdecec;color:#c0392b}.fub.today{background:#fff4e0;color:#b26a00}.fub.later{background:#eef0f3;color:#3d4350}.fub.na{color:#9a5b00;background:#fff8ec;border:1px dashed #f0c27a}.fub.none{color:#8a919c;border:1px dashed #cfd4da}

 <div class="cfm-f"><button class="btn" id="cfmNo">Cancel</button><button class="btn pri" id="cfmYes">Yes</button></div></div></div>

<script>
/* ================= CONFIG ================= */
const SHEET_ID="1Aw73vwzpFFdyT08j8BZ4klGE7uamFJwpew7kBCSHLrU";
const SHEET_URL_DEFAULT="https://docs.google.com/spreadsheets/d/"+SHEET_ID+"/edit";
const SRV="Google Sheets";
// Apps Script Web app URL for this team's sheet. Logins are checked by the Apps Script; no secrets live in this file.
const BUILTIN_API="https://script.google.com/macros/s/AKfycbz9UyLJzPbROL9kSAAmw0R5uG1qQorrEOr24IMOioQVXcIuIBjir9L90cCasmMoGxGn/exec";
const ROLES=["Admin","Manager","Team Lead","Sales Manager","Telecaller Executive"];
/* Any other text in the Role column is a designation Admin typed (works like a Telecaller until given Permissions) */
const roleOf=raw=>{const v=String(raw||"").trim();if(!v||/^employee$/i.test(v))return "Telecaller Executive";return ROLES.find(x=>x.toLowerCase()===v.toLowerCase())||v};
const isCustomRole=r=>!ROLES.includes(r);
const OUTCOMES={
  int:{label:"Interested",cls:"s-int"},
  cb:{label:"Call back later",cls:"s-cb"},
  ni:{label:"Not interested",cls:"s-ni"},
  na:{label:"No answer / Busy",cls:"s-na"},
  nc:{label:"Not connected",cls:"s-nc"},
  wn:{label:"Wrong / Switched off",cls:"s-wn"},
  conv:{label:"Converted",cls:"s-conv"},
};
const STATUS={new:{label:"New",cls:"s-new"},...OUTCOMES};
const CODE_BY_LABEL=Object.fromEntries(Object.entries(STATUS).map(([k,v])=>[v.label.toLowerCase(),k]));
const statusCode=l=>CODE_BY_LABEL[String(l||"").trim().toLowerCase()]||"new";

/* ================= HELPERS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const toSheetTime=t=>{if(!t)return"";const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
function parseT(v){if(v===""||v==null)return null;const m=String(v).match(/^(\d{4})-(\d{1,2})-(\d{1,2})[ T](\d{1,2}):(\d{2})/);
  if(m)return new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5]).getTime();const t=Date.parse(v);return isNaN(t)?null:t}
const fmt=t=>{if(!t)return"—";const d=new Date(t);return d.toLocaleDateString("en-IN",{day:"2-digit",month:"short"})+", "+d.toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit"})};
const today=t=>t&&new Date(t).toDateString()===new Date().toDateString();
const initials=n=>String(n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();
function telHref(p){let d=String(p).replace(/[^\d+]/g,"");if(/^\d{10}$/.test(d))d="+91"+d;return "tel:"+d}
function normPhone(p){const raw=String(p).trim();let d=raw.replace(/\D/g,"");
  if(d.length===12&&d.startsWith("91"))d=d.slice(2);if(d.length===11&&d.startsWith("0"))d=d.slice(1);
  if(d.length===10)return d.slice(0,5)+" "+d.slice(5);return raw.startsWith("+")?"'"+raw:raw}
const pill=s=>`<span class="pill ${STATUS[s].cls}">${STATUS[s].label}</span>`;
/* Ask before anything is opened, changed or assigned. Resolves true only when the person clicks the confirm button. */
function askOk({title,body="",ok="Yes",danger=false}){return new Promise(res=>{const bg=$("#cfmbg"),y=$("#cfmYes"),n=$("#cfmNo");
  $("#cfmT").textContent=title;$("#cfmB").innerHTML=body;y.textContent=ok;y.className="btn "+(danger?"danger":"pri");
  const done=v=>{bg.classList.remove("show");document.removeEventListener("keydown",key);res(v)};
  const key=e=>{if(e.key==="Escape")done(false)};document.addEventListener("keydown",key);
  y.disabled=false;y.onclick=()=>done(true);n.onclick=()=>done(false);bg.onclick=e=>{if(e.target===bg)done(false)};bg.classList.add("show");setTimeout(()=>n.focus(),30)})}
const tlOf=eid=>{const e=(S.allEmps||[]).find(x=>x.id===eid);if(!e)return"";return e.role==="Team Lead"?e.name:e.tl?empName(e.tl):""};
const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),2800)};
const rank=r=>{const i=ROLES.indexOf(r);return i<0?99:i};

/* ================= STATE ================= */
let S={employees:[],allEmps:[],leads:[]};
let MODE="loading", BUSY=false, lastSync=null, demoReason="";
let ME=null, SHEET_URL="";              // ME is set only for personal logins (website). null = full access (claude.ai / demo)
/* show / hide PIN: an eye button inside every PIN box (login, change PIN, …) */
(()=>{const EYE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const OFF='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.4 0 10 7 10 7a17.6 17.6 0 0 1-3.2 4.2M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';
  const add=()=>document.querySelectorAll('input[type="password"]:not([data-pw])').forEach(inp=>{inp.dataset.pw="1";const w=document.createElement("span");w.className="pw";
    inp.parentNode.insertBefore(w,inp);w.appendChild(inp);const b=document.createElement("button");b.type="button";b.className="eye";b.innerHTML=EYE;b.setAttribute("aria-label","Show PIN");b.setAttribute("aria-pressed","false");b.title="Show PIN";
    b.onclick=()=>{const show=inp.type==="password";inp.type=show?"text":"password";b.innerHTML=show?OFF:EYE;const t=show?"Hide PIN":"Show PIN";b.setAttribute("aria-label",t);b.title=t;b.setAttribute("aria-pressed",show?"true":"false");inp.focus()};w.appendChild(b)});
  add();new MutationObserver(add).observe(document.body,{childList:true,subtree:true})})();
/* phone menu (☰): open/close; closes after picking something or tapping outside */
(()=>{const hdr=document.querySelector("header"),btn=document.getElementById("menuBtn"),menu=document.getElementById("hmenu");
  const set=o=>{hdr.classList.toggle("open",o);btn.setAttribute("aria-expanded",o?"true":"false");btn.textContent=o?"✕":"☰"};
  btn.onclick=e=>{e.stopPropagation();set(!hdr.classList.contains("open"))};
  document.addEventListener("click",e=>{if(!hdr.contains(e.target))set(false)});
  menu.addEventListener("click",e=>{if(e.target.closest("a,button"))setTimeout(()=>set(false),0)});
  menu.addEventListener("change",()=>set(false));document.addEventListener("keydown",e=>{if(e.key==="Escape")set(false)})})();
let view={who:"admin",tab:"today",filter:"all",q:"",sel:new Set(),assignFilter:"all",logEmp:"all",logOut:"all"};
const emp=id=>S.allEmps.find(e=>e.id===id);
const empName=id=>id==="ADMIN_LOG"?"Admin":(emp(id)?.name||id||"—");
/* "Desk" view (tabs): Admin, Manager, Team Lead – or anyone Admin has given at least one tab */
const isLead=()=>!ME||rank(ME.role)<=rank("Team Lead")||TAB_KEYS.some(k=>can(k));
/* ---- Permission levels (same lists as the server). Role defaults + per-person ticks set by Admin. ---- */
const SCOPE_OPTS=[["own","Only their own","their own contacts, calls & cases"],["team","Their team","everyone under the same Team Lead"],["all","Everyone","the whole company"]];
const PERM_DEF=[["Tabs they can see",[["dash","Dashboard"],["lead","Interested"],["cases","Lead Cases"],["byemp","By Employee"],["assign","Calling List & Assign"],["import","Add / Import Contacts"],["team","Employees / My Team"],["logs","Call Logs"],["meet","Field Work"],["reports","Reports & downloads"],["perf","Performance & targets"]]],
  ["What they can do",[["doAssign","Assign contacts & share out"],["caseEdit","Open & edit lead cases"],["caseTL","Move a case to another Team Lead"],["caseTransfer","Transfer a case (Admin by default)"],["caseRemove","Remove lead cases"],["empEdit","Add, edit & remove employees"],["pinReset","Reset PINs"],["sheet","Open the Google Sheet"],["viewAs","Open anyone's page (Viewing as)"],["targetEdit","Set monthly targets"]]]];
const PERM_KEYS=[...PERM_DEF.flatMap(g=>g[1].map(x=>x[0])),"scopeTeam","scopeAll"];
const TAB_KEYS=PERM_DEF[0][1].map(x=>x[0]);
const ROLE_PERMS={"Manager":["dash","lead","cases","byemp","assign","import","team","logs","meet","reports","doAssign","caseEdit","caseTL","empEdit","pinReset","scopeAll"],
  "Team Lead":["dash","lead","cases","byemp","assign","import","team","logs","meet","doAssign","caseEdit","pinReset","scopeTeam"],"Sales Manager":[],"Telecaller Executive":[]};
const NOT_EMP=PERM_KEYS.filter(k=>k!=="empEdit");
const PERM_ALLOWED={"Manager":PERM_KEYS,"Team Lead":NOT_EMP,"Sales Manager":NOT_EMP,"Telecaller Executive":NOT_EMP.filter(k=>k!=="pinReset")};
const basePerms=r=>ROLE_PERMS[r]||[],allowedPerms=r=>PERM_ALLOWED[r]||PERM_ALLOWED["Telecaller Executive"];
const scopeOf=set=>set.has("scopeAll")?"all":set.has("scopeTeam")?"team":"own";
function permsOf(e){if(!e)return new Set();if(e.role==="Admin")return new Set(PERM_KEYS);const set=new Set(basePerms(e.role)),ok=new Set(allowedPerms(e.role));
  String(e.permRaw||"").split(/[,\s]+/).forEach(t=>{const k=t.slice(1);if(!ok.has(k))return;if(t[0]==="+")set.add(k);else if(t[0]==="-")set.delete(k)});return set}
const can=k=>!ME||ME.role==="Admin"||(Array.isArray(ME.perms)?ME.perms.includes(k):permsOf(ME).has(k));
const canViewAs=()=>!ME||ME.role==="Admin"||(isLead()&&can("viewAs"));   // "Viewing as" (open anyone's page): Admin, or anyone Admin allows
const isTL=()=>!!ME&&ME.role==="Team Lead";                 // Team Leads get only their own team from the server
// Teams: a Team Lead + everyone whose "Team Lead" is them. Admin / Manager can filter every page by team.
const teamLeads=(R=RAW||S)=>R.allEmps.filter(e=>e.role==="Team Lead"&&e.active);
const teamOf=e=>!e?"":e.role==="Team Lead"?e.id:(e.tl||"");
const teamName=id=>id==="none"?"No team":(emp(id)?.name||id)+"'s team";
let RAW=null;const SCOPED_TABS=new Set(["dash","lead","cases","byemp","assign","logs","reports"]);
function scopeData(R,t){
  const inT=e=>t==="none"?(!teamOf(e)&&e.role!=="Sales Manager"):teamOf(e)===t;
  const ids=new Set(R.allEmps.filter(inT).map(e=>e.id));
  return {...R,employees:R.employees.filter(e=>ids.has(e.id)),leads:R.leads.filter(l=>ids.has(l.assignedTo)),
    cases:(R.cases||[]).filter(c=>t==="none"?!c.tlId:(c.tlId===t||ids.has(c["Telecaller ID"]))),__scoped:true};
}
const isMgr=()=>!ME||rank(ME.role)<=rank("Manager");
const canManageRole=r=>!ME||ME.role==="Admin"||rank(r)>rank(ME.role);

/* ================= BUILD FROM SHEET ROWS ================= */
function build(eRows,lRows,cRows){
  const allEmps=eRows.map((r,i)=>({id:String(r[0]||"").trim(),name:String(r[1]||"").trim(),phone:String(r[2]??""),
    active:String(r[3]||"Yes").trim().toLowerCase()!=="no",role:roleOf(r[4]),
    pinSet:!!(String(r[5]||"").trim()||String(r[6]||"").trim()),tlRaw:String(r[6]||"").trim(),lastLogin:parseT(r[7]),permRaw:String(r[8]||"").trim(),row:i+2})).filter(e=>e.id&&e.name);
  allEmps.forEach(e=>{const t=allEmps.find(x=>x.role==="Team Lead"&&x.id===e.tlRaw&&e.role!=="Team Lead");e.tl=t?t.id:"";delete e.tlRaw});
  const findEmp=v=>{v=String(v||"").trim();if(!v)return null;const lv=v.toLowerCase();const e=allEmps.find(e=>e.id.toLowerCase()===lv||e.name.toLowerCase()===lv);return e?e.id:v};
  const leads=lRows.map((r,i)=>({id:String(r[0]||"").trim(),name:String(r[1]||""),phone:String(r[2]??""),city:String(r[3]||""),assignedTo:findEmp(r[4]),
    status:statusCode(r[5]),followUp:parseT(r[6]),lastRemark:String(r[7]||""),lastAt:parseT(r[8]),created:parseT(r[9]),
    source:["Website","Import","Manual"].find(x=>x.toLowerCase()===String(r[10]||"").trim().toLowerCase())||"Import",
    firstRemark:String(r[11]||"")||(/^Website enquiry/.test(String(r[7]||""))?String(r[7]):""),row:i+2,logs:[]})).filter(l=>l.id||l.name);
  const byId=Object.fromEntries(leads.map(l=>[l.id,l]));
  cRows.forEach(r=>{const l=byId[String(r[2]||"").trim()];if(!l)return;

function explain(err){
  const c=err&&err.code;
  if(c==="needs_reauth")return "Your Google Sheets connection has expired. Reconnect Google Sheets in claude.ai → Settings → Connectors, then press Refresh.";
  if(c==="server_not_connected"||c==="selection_required")return "Google Sheets isn't connected for your account. Add it in claude.ai → Settings → Connectors, then press Refresh.";
  if(c==="not_in_manifest"||c==="approval_required"||c==="consent_required")return "This page needs your permission to use Google Sheets. Press Refresh and choose Allow.";
  if(c==="blocked_by_policy")return "Your organization's policy blocks Google Sheets for this page.";
  if(c==="tool_error")return "Google Sheets refused the request – check that your Google account can edit the sheet.";
  if(c==="server_unavailable")return "Google Sheets didn't respond. Press Refresh to try again.";
  if(err&&/Failed to fetch|NetworkError|Load failed/i.test(err.message||""))return "Can't reach the CRM server – check your internet connection and press Refresh.";
  return (err&&err.message)||"Something went wrong talking to Google Sheets.";
}

const DAY=864e5;
const sod=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
const ymd=t=>{const d=new Date(t);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const RANGES=[["today","Today"],["yesterday","Yesterday"],["7d","Last 7 days"],["30d","Last 30 days"],["month","This month"],["pickm","Pick month"],["all","All time"],["custom","Custom"]];

const curRange=()=>onFieldWork()?view.fwRange:(view.who!=="admin"?view.cRange:view.range);
function rangeBounds(){
  const r=curRange(),t0=sod(Date.now());

    case"yesterday":return[t0-DAY,t0-1];
    case"7d":return[t0-6*DAY,t0+DAY-1];
    case"30d":return[t0-29*DAY,t0+DAY-1];
    case"month":{const d=new Date();return[new Date(d.getFullYear(),d.getMonth(),1).getTime(),t0+DAY-1]}
    case"pickm":{const [y,mo]=String(r.month||ymd(Date.now()).slice(0,7)).split("-").map(Number);return[new Date(y,mo-1,1).getTime(),new Date(y,mo,1).getTime()-1]}
    case"all":{const ts=[...S.leads.flatMap(l=>[l.created,...l.logs.map(g=>g.at)]),...(S.meetings||[]).map(m=>m.at)].filter(Boolean);return[ts.length?sod(Math.min(...ts)):t0,t0+DAY-1]}
    default:{const a=parseT(r.from+" 00:00")||t0,b=parseT(r.to+" 00:00")||t0;return[Math.min(a,b),Math.max(a,b)+DAY-1]}

/* ================= METRICS ================= */
const NOT_CONN=["na","nc","wn"];
const CONNECTED=o=>!NOT_CONN.includes(o);
const pct=(a,b)=>b?Math.round(a/b*100):0;
function metrics(){
  const logs=allLogs().filter(g=>inRange(g.at));
  const newLeads=S.leads.filter(l=>inRange(l.created));
  const endToday=sod(Date.now())+DAY-1;
  const byOutcome=Object.fromEntries(Object.keys(OUTCOMES).map(k=>[k,logs.filter(g=>g.outcome===k).length]));
  const people=callers().map(e=>{
    const mine=logs.filter(g=>g.by===e.id),con=mine.filter(g=>CONNECTED(g.outcome)).length;
    const assigned=S.leads.filter(l=>l.assignedTo===e.id);
    return {e,calls:mine.length,connected:con,int:mine.filter(g=>g.outcome==="int").length,conv:mine.filter(g=>g.outcome==="conv").length,
      ni:mine.filter(g=>g.outcome==="ni").length,na:mine.filter(g=>NOT_CONN.includes(g.outcome)).length,
      leads:mine.length?new Set(mine.map(g=>g.lead.id)).size:0,gen:leadsIn(assigned).length,assigned:assigned.length,
      untouched:assigned.filter(l=>l.status==="new").length,due:assigned.filter(l=>l.status==="cb"&&l.followUp&&l.followUp<=endToday).length};
  }).sort((a,b)=>b.calls-a.calls||b.conv-a.conv);
  const connected=logs.filter(g=>CONNECTED(g.outcome)).length;
  const leads=leadsIn();
  return {logs,newLeads,leads,byOutcome,people,connected,
    website:newLeads.filter(l=>l.source==="Website").length,
    due:S.leads.filter(l=>l.status==="cb"&&l.followUp&&l.followUp<=endToday).length,
    unassigned:S.leads.filter(l=>!l.assignedTo).length};
}

/* ================= CHART HELPERS (single brand hue, direct labels, hover tooltips) ================= */
function dayBuckets(logs){
  const[a,b]=rangeBounds();const days=Math.round((sod(b)-sod(a))/DAY)+1;
  const byMonth=days>92;const keyOf=t=>byMonth?ymd(t).slice(0,7):ymd(t); // local months (toISOString would shift IST dates into the previous month)
  const buckets=[];
  if(byMonth){const d=new Date(a);d.setDate(1);while(d.getTime()<=b){buckets.push({k:keyOf(d.getTime()),label:d.toLocaleDateString("en-IN",{month:"short",year:"2-digit"}),n:0});d.setMonth(d.getMonth()+1)}}
  else for(let t=sod(a);t<=b;t+=DAY){const d=new Date(t);buckets.push({k:ymd(t),label:d.toLocaleDateString("en-IN",{day:"numeric",month:"short"}),n:0})}
  const idx=Object.fromEntries(buckets.map((x,i)=>[x.k,i]));
  logs.forEach(g=>{const i=idx[keyOf(g.at)];if(i!=null)buckets[i].n++});
  return {buckets,unit:byMonth?"month":"day"};
}
function columnChart(buckets,unit){
  if(!buckets.length)return "";
  const W=640,H=200,pl=34,pr=8,pt=14,pb=26,max=Math.max(1,...buckets.map(b=>b.n));
  const nice=max<=5?5:max<=10?10:max<=50?Math.ceil(max/10)*10:Math.ceil(max/50)*50;   /* round scale, so the middle line is a whole number */const iw=W-pl-pr,ih=H-pt-pb,bw=iw/buckets.length,gap=Math.min(6,bw*.25);
  const narrow=window.innerWidth<640;   /* phones: bigger text (CSS), so fewer date labels */
  const y=v=>pt+ih-(v/nice)*ih;const every=Math.ceil(buckets.length/(narrow?4:8));
  /* date labels: every Nth bar plus the last one – drop the one before the last if they would touch */
  const lab=new Set();for(let i=0;i<buckets.length;i+=every)lab.add(i);const last=buckets.length-1;
  if(!lab.has(last)){const prev=Math.floor(last/every)*every;if(last-prev<every&&prev!==0)lab.delete(prev);lab.add(last)}
  const edge=narrow?36:20,lx=i=>Math.min(Math.max(pl+i*bw+bw/2,pl+edge),W-pr-edge);
  let g=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Calls per ${unit}">`;
  [0,.5,1].forEach(f=>{const v=Math.round(nice*f);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="grid"/><text x="${pl-6}" y="${y(v)+4}" class="ax" text-anchor="end">${v}</text>`});
  const peak=buckets.reduce((m,b,i)=>b.n>buckets[m].n?i:m,0);
  buckets.forEach((b,i)=>{const x=pl+i*bw+gap/2,w=Math.max(2,bw-gap),h=ih-(y(b.n)-pt);
    if(b.n)g+=`<path d="M${x},${pt+ih} v${-(h-Math.min(4,w/2,h))} q0,${-Math.min(4,w/2,h)} ${Math.min(4,w/2)},${-Math.min(4,w/2,h)} h${w-2*Math.min(4,w/2)} q${Math.min(4,w/2)},0 ${Math.min(4,w/2)},${Math.min(4,w/2,h)} v${h-Math.min(4,w/2,h)} z" class="bar-m"/>`;
    g+=`<rect x="${pl+i*bw}" y="${pt}" width="${bw}" height="${ih}" fill="transparent" data-tip="${esc(b.label)}: ${b.n} call${b.n===1?"":"s"}"/>`;
    if(lab.has(i))g+=`<text x="${lx(i)}" y="${H-8}" class="ax" text-anchor="middle">${esc(b.label)}</text>`;
    if(i===peak&&b.n)g+=`<text x="${pl+i*bw+bw/2}" y="${y(b.n)-5}" class="val" text-anchor="middle">${b.n}</text>`});
  return g+`</svg>`;
}
function hbars(rows,{fmtV=v=>v,emptyMsg="No data in this period"}={}){
  const max=Math.max(1,...rows.map(r=>r.v));
  if(!rows.some(r=>r.v))return `<div class="empty small">${emptyMsg}</div>`;
  return `<div class="hbars">${rows.map(r=>`<div class="hb" data-tip="${esc(r.label)}: ${esc(fmtV(r.v))}${r.tip?" – "+esc(r.tip):""}"><span class="hl">${r.pill||esc(r.label)}</span><span class="ht"><i style="width:${Math.max(r.v?2:0,r.v/max*100)}%"></i></span><b class="hv">${esc(fmtV(r.v))}</b></div>`).join("")}</div>`;
}
function bindTips(){
  let tip=$("#tip");if(!tip){tip=document.createElement("div");tip.id="tip";document.body.appendChild(tip)}
  document.querySelectorAll("[data-tip]").forEach(el=>{
    el.onmousemove=e=>{tip.textContent=el.dataset.tip;tip.style.display="block";const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+"px";tip.style.top=(e.clientY-36)+"px"};
    el.onmouseleave=()=>tip.style.display="none";
  });
}

/* ---------- CALL ACTIVITY (Callyzer-style, from CRM call logs) ---------- */
const hm=ms=>{const m=Math.round(ms/60000);return m<60?m+"m":Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m"};
const tOf=t=>new Date(t).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"});
function activity(logs){
  const byP=new Map();
  logs.forEach(g=>{const k=g.by+"|"+ymd(g.at);if(!byP.has(k))byP.set(k,{by:g.by,day:ymd(g.at),a:g.at,b:g.at,n:0});const x=byP.get(k);x.a=Math.min(x.a,g.at);x.b=Math.max(x.b,g.at);x.n++});
  const people=new Map();
  [...byP.values()].forEach(d=>{if(!people.has(d.by))people.set(d.by,{by:d.by,days:[],calls:0,span:0});const p=people.get(d.by);p.days.push(d);p.calls+=d.n;p.span+=Math.max(d.b-d.a,d.n>1?0:0)});
  const out=[...people.values()].map(p=>{const mine=logs.filter(g=>g.by===p.by);
    const mins=t=>{const d=new Date(t);return d.getHours()*60+d.getMinutes()};const avg=a=>Math.round(a.reduce((s,x)=>s+x,0)/a.length);
    const fa=avg(p.days.map(d=>mins(d.a))),la=avg(p.days.map(d=>mins(d.b)));const lab=v=>{const d=new Date(2000,0,1,Math.floor(v/60),v%60);return d.toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"})};
    return {...p,first:lab(fa),last:lab(la),uniq:new Set(mine.map(g=>g.lead.id)).size,np:mine.filter(g=>g.outcome==="na"||g.outcome==="nc").length,wn:mine.filter(g=>g.outcome==="wn").length,con:mine.filter(g=>CONNECTED(g.outcome)).length,
      perHr:p.span>=15*60000?(p.calls/(p.span/3600000)).toFixed(1):"—"}}).sort((a,b)=>b.calls-a.calls);
  const hours=[];for(let i=8;i<=21;i++)hours.push({h:i,label:new Date(2000,0,1,i).toLocaleTimeString("en-IN",{hour:"numeric"}),n:0});
  logs.forEach(g=>{const x=hours.find(b=>b.h===new Date(g.at).getHours());if(x)x.n++});
  return {people:out,hours,span:out.reduce((s,p)=>s+p.span,0),uniq:new Set(logs.map(g=>g.lead.id)).size,np:logs.filter(g=>g.outcome==="na"||g.outcome==="nc").length,wn:logs.filter(g=>g.outcome==="wn").length}
}
function activitySection(m){
  const A=activity(m.logs),one=(()=>{const[a,b]=rangeBounds();return sod(a)===sod(b)})();
  const card=(label,val,sub,ic)=>`<div class="card stat act"><span>${ic} ${label}</span><b>${val}</b>${sub?`<div class="small mute">${sub}</div>`:""}</div>`;
  const peak=A.hours.reduce((m2,b)=>b.n>m2.n?b:m2,{n:0});
  let h=`<div class="card pad" style="margin-bottom:16px"><div class="row" style="justify-content:space-between;align-items:baseline"><h3 style="margin:0">Call activity</h3><span class="small mute">From calls logged in the CRM · talk time and incoming/missed calls need a phone app</span></div>
  <div class="stats" style="margin-top:12px">
    ${card("Unique customers",A.uniq,`different people called`,"👥")}
    ${card("Not picked up",A.np,`no answer / busy / not connected`,"📵")}
    ${card("Wrong / switched off",A.wn,`numbers to check`,"⚠️")}
    ${card("Working time",A.span?hm(A.span):"—",`first to last call, all callers`,"⏱")}
    ${card("Busiest hour",peak.n?peak.label:"—",peak.n?`${peak.n} calls`:"no calls","🔥")}
  </div>
  <div class="grid2 dash" style="margin-top:4px"><div><h3 style="margin:10px 0 6px">Calls by hour of day</h3>${m.logs.length?columnChart(A.hours.map(b=>({label:b.label,n:b.n})),"hour"):`<div class="empty small">No calls in this period</div>`}</div>
  <div><h3 style="margin:10px 0 6px">Telecaller activity</h3>${A.people.length?`<div class="tw"><table><tr><th>Telecaller</th><th>${one?"First call":"Avg start"}</th><th>${one?"Last call":"Avg end"}</th><th>Working time</th><th>Calls / hour</th><th>Unique</th><th>Not picked up</th></tr>
    ${A.people.map(p=>`<tr><td style="white-space:nowrap"><b>${esc(empName(p.by))}</b>${one?"":`<div class="small mute">${p.days.length} day${p.days.length===1?"":"s"} active</div>`}</td><td class="num" style="white-space:nowrap">${p.first}</td><td class="num" style="white-space:nowrap">${p.last}</td><td class="num"><b>${hm(p.span)}</b></td><td class="num">${p.perHr}</td><td class="num">${p.uniq}</td><td class="num">${p.np}</td></tr>`).join("")}</table></div>`:`<div class="empty small">No calls in this period</div>`}</div></div></div>`;
  return h}

  let h=rangeBar();

    <tr><th>Telecaller</th><th>Calls</th><th style="width:18%"></th><th>Connected</th><th>Interested</th><th>Converted</th><th>Conversion</th><th>Assigned</th><th>Not yet called</th><th>Callbacks due</th></tr>`;
  const maxC=Math.max(1,...m.people.map(p=>p.calls));
  h+=m.people.map(p=>`<tr><td><b>${esc(p.e.name)}</b><div class="small mute">${esc(p.e.role)}</div></td><td class="num"><b>${p.calls}</b></td>
    <td><div class="bar" data-tip="${esc(p.e.name)}: ${p.calls} calls"><i style="width:${p.calls/maxC*100}%"></i></div></td>
    <td class="num">${p.connected}${p.calls?` <span class="small mute">${pct(p.connected,p.calls)}%</span>`:""}</td><td class="num">${p.gen}</td><td class="num">${p.conv}</td>
    <td class="num">${p.connected?pct(p.conv,p.connected)+"%":"—"}</td><td class="num">${p.assigned}</td><td class="num">${p.untouched}</td><td class="num">${p.due?`<b style="color:var(--amber)">${p.due}</b>`:0}</td></tr>`).join("")||`<tr><td colspan="10"><div class="empty">No telecallers yet – add them under Employees</div></td></tr>`;
  h+=`</table></div></div>`;
  const stage=[["New – not yet called",L.filter(l=>l.status==="new").length],["Being followed up",L.filter(l=>["cb",...NOT_CONN].includes(l.status)).length],["Interested",L.filter(l=>l.status==="int").length],["Converted",L.filter(l=>l.status==="conv").length],["Not interested",L.filter(l=>l.status==="ni").length]];
  const srcs=["Website","Import","Manual"].map(s=>[s,m.newLeads.filter(l=>l.source===s).length]);
  h+=`<div class="grid2 dash" style="margin-top:16px">
    <div class="card pad"><h3>Calling list status <span class="small mute" style="font-weight:400">all ${L.length} contacts, as of now</span></h3>${hbars(stage.map(([l,v])=>({label:l,v,tip:pct(v,L.length)+"% of all contacts"})),{emptyMsg:"No contacts yet"})}</div>
    <div class="card pad"><h3>New contacts by source <span class="small mute" style="font-weight:400">in this period</span></h3>${hbars(srcs.map(([l,v])=>({label:l==="Website"?"Website enquiries":l==="Import"?"Imported lists":"Added manually",v})),{emptyMsg:"No new contacts in this period"})}
      <h3 style="margin-top:18px">Recent activity</h3>${m.logs.slice(0,5).map(g=>`<div class="hi"><b>${esc(empName(g.by))}</b> called <b>${esc(g.lead.name)}</b> ${pill(g.outcome)}<div class="mute small" style="margin-top:3px">${esc(g.remark)||"<i>No remark</i>"} · ${fmt(g.at)}</div></div>`).join("")||`<div class="empty small">No calls in this period</div>`}</div>
  </div>`;
  return h;
}

  return [["Date","Time","Telecaller","Customer","Mobile","City","Outcome","Remark","Follow-up","Contact ID","Source"],
    ...logs.map(g=>{const s=T(g.at);return [s.slice(0,10),s.slice(11),empName(g.by),g.lead.name,g.lead.phone,g.lead.city,OUTCOMES[g.outcome].label,g.remark,T(g.followUp),g.lead.id,g.lead.source]})];

function rPerformance(){
  return [["Telecaller","Role","Calls","Connected","Connect rate %","Interested customers","Interested calls","Converted","Conversion % (of connected)","Not interested","Not connected (no answer / not connected / wrong no.)","Unique customers called","Assigned now","Not yet called","Callbacks due"],
    ...metrics().people.map(p=>[p.e.name,p.e.role,p.calls,p.connected,pct(p.connected,p.calls),p.gen,p.int,p.conv,pct(p.conv,p.connected),p.ni,p.na,p.leads,p.assigned,p.untouched,p.due])];

function rLeads(){

function rInterested(){

const lcSmKey=c=>{const v=String(c["SM Name"]||"").trim().replace(/\s+/g," ");return v||"Not recorded"};

const ACR_=new Set(["SBI","HDFC","ICICI","BOM","BOB","PNB","LIC","IDFC","IDBI","UCO","RBL","AU","NBFC","CRM","PSF","PL","BL","HL","LAP","CP","KYC","DSA","LLP","CR","EMI","MD","CEO","GM"]);
const SMALL_=new Set(["of","and","in","for","the","to","at","on","by","with"]);
// Proper case for names ("amit nagdevi" -> "Amit Nagdevi", keeps SBI / HDFC / KR in capitals)
function properName(s){let i=0;return String(s==null?"":s).replace(/\s+/g," ").trim().replace(/[A-Za-z][A-Za-z’']*/g,w=>{const first=i++===0;const core=w.replace(/[’']s$/i,"");
  if(ACR_.has(core.toUpperCase()))return core.toUpperCase()+w.slice(core.length).toLowerCase();if(w===w.toUpperCase()&&w.length<=2)return w;
  if(!first&&SMALL_.has(w.toLowerCase()))return w.toLowerCase();return w[0].toUpperCase()+w.slice(1).toLowerCase()})}
// Tidy free text: capital first letter, "1cr" -> "1 CR"
function tidyText(s){s=String(s==null?"":s).replace(/[ \t]+/g," ").trim().replace(/(\d+(?:\.\d+)?)\s*cr\b/gi,"$1 CR");return s?s[0].toUpperCase()+s.slice(1):s}

// Existing % received in market if any · Contact no of the Entity · Purpose of Meeting · Meeting Outcome ·
// Remarks · Any Tieup currently? · If Yes, Tie up with which company · Current pass back received · Feedback
const M_TYPES=["Physical","Call"];
const M_ENTITY=["Customer","Banker","Connector","Developer","CP","Other"];
const M_YESNO=["Yes","No","Maybe"];
const M_PURPOSE=["For lead","Tie-up","Login","Disbursement","Follow-up","Payout discussion","Other"];
const FW_LABEL={at:"Timestamp",sm:"SM Name",type:"Meeting Type",ent:"Meeting Entity",person:"Name of the CP/Developer/Customer/Connector",entity:"Name of The Entity",
  willing:"Willing to work with SN",existing:"Existing % received in market if any",phone:"Contact no of the Entity",purpose:"Purpose of Meeting",outcome:"Meeting Outcome",
  interest:"Interested / Not interested",remarks:"Remarks",tieup:"Any Tieup currently?",tieupWith:"If Yes, Tie up with which company",passback:"Current pass back received",feedback:"Feedback"};
function buildMeetings(rows){
  const g=(r,i)=>String(r[i]||"").trim();
  return (rows||[]).map(r=>({id:g(r,0),at:parseT(r[1]),sm:g(r,2),smId:g(r,3),type:g(r,4),ent:g(r,5),person:g(r,6),entity:g(r,7),willing:g(r,8),existing:g(r,9),
    phone:g(r,10),purpose:g(r,11),outcome:g(r,12),interest:g(r,13),remarks:g(r,14),tieup:g(r,15),tieupWith:g(r,16),passback:g(r,17),feedback:g(r,18),updated:parseT(r[19]),updatedBy:g(r,20)}))
    .filter(m=>m.id||m.person||m.entity).sort((a,b)=>(b.at||0)-(a.at||0));
}
const canEditMeeting=m=>!ME||isLead()||m.smId===ME.id||normName(m.sm)===normName(ME.name);
if(!view.mq){view.mq="";view.mSm="all";view.mEnt="all";view.mType="all";view.mInt="all"}
function meetingsInView(){
  const q=view.mq.toLowerCase();
  const pe=view.who!=="admin"&&emp(view.who);   // viewing one person's page
  return (S.meetings||[]).filter(m=>inRange(m.at)&&(!pe||m.smId===pe.id||normName(m.sm)===normName(pe.name))&&(view.mSm==="all"||view.who!=="admin"||m.sm===view.mSm)&&(view.mEnt==="all"||m.ent===view.mEnt)&&(view.mType==="all"||m.type===view.mType)&&(view.mInt==="all"||(view.mInt==="none"?!m.interest:m.interest===view.mInt))
    &&(!q||[m.person,m.entity,m.phone,m.purpose,m.outcome,m.remarks,m.feedback,m.sm,m.tieupWith].join(" ").toLowerCase().includes(q)));
}
const entCls=w=>({Customer:"s-int",Banker:"s-conv",Connector:"s-cb",Developer:"s-na",CP:"s-wn"})[w]||"s-new";
const yesCls=v=>v==="Yes"?"s-int":v==="No"?"s-ni":v?"s-cb":"";
const intPill=v=>v==="Interested"?`<span class="pill s-int">Interested</span>`:v==="Not interested"?`<span class="pill s-ni">Not interested</span>`:"";
function aMeetings(){
  const list=meetingsInView(),all=S.meetings||[];
  const sms=[...new Set(all.map(m=>m.sm).filter(Boolean))].sort();
  const c=f=>list.filter(f).length;
  let h=rangeBar();
  if(S.meetErr)h+=`<div class="banner" style="padding:0;margin:0 0 12px"><div>⚠ Couldn't load field work: ${esc(S.meetErr)}</div></div>`;
  h+=`<div class="stats">
    <div class="card stat"><span>Meetings</span><b>${list.length}</b><div class="small mute">${c(m=>m.type==="Physical")} physical · ${c(m=>m.type==="Call")} call</div></div>
    <div class="card stat"><span>Interested</span><b style="color:var(--green)">${c(m=>m.interest==="Interested")}</b><div class="small mute">${c(m=>m.interest==="Not interested")} not interested · ${c(m=>!m.interest)} not marked</div></div>
    <div class="card stat"><span>Have a tie-up already</span><b>${c(m=>m.tieup==="Yes")}</b></div>
    <div class="card stat"><span>Connectors & CPs</span><b>${c(m=>m.ent==="Connector"||m.ent==="CP")}</b></div>
    <div class="card stat"><span>Developers</span><b>${c(m=>m.ent==="Developer")}</b></div>
    <div class="card stat"><span>Bankers & customers</span><b>${c(m=>m.ent==="Banker"||m.ent==="Customer")}</b></div></div>`;
  h+=`<div class="card pad" style="margin-bottom:12px"><div class="row">
    <input id="mq" placeholder="Search name, entity, number, remarks" value="${esc(view.mq)}" style="flex:1;min-width:200px">
    ${isLead()&&view.who==="admin"?`<select id="mSm"><option value="all">All SMs</option>${sms.map(s=>`<option ${view.mSm===s?"selected":""}>${esc(s)}</option>`).join("")}</select>`:""}
    <select id="mEnt"><option value="all">Meeting entity: all</option>${M_ENTITY.map(s=>`<option ${view.mEnt===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
    <select id="mInt"><option value="all">Interested & not</option>${[["Interested","Interested"],["Not interested","Not interested"],["none","Not marked yet"]].map(([k,l])=>`<option value="${k}" ${view.mInt===k?"selected":""}>${l}</option>`).join("")}</select>
    <select id="mType"><option value="all">Physical & call</option>${M_TYPES.map(s=>`<option ${view.mType===s?"selected":""}>${esc(s)}</option>`).join("")}</select>
    <button class="btn pri" id="mAdd">＋ Add field work</button></div></div>`;
  h+=`<div class="card tw"><table class="mtable"><tr><th>Timestamp</th>${isLead()?"<th>SM Name</th>":""}<th>Meeting Entity</th><th>Name of CP / Developer / Customer / Connector</th><th>Contact no</th><th>Interested?</th><th>Purpose</th><th>Meeting Outcome</th><th>Remarks / Feedback</th><th></th></tr>`;
  h+=list.map(m=>`<tr class="mrow"><td class="num small" style="white-space:nowrap">${m.at?fmt(m.at):"—"}<div class="mute">${esc(m.type)}</div></td>
    ${isLead()?`<td>${esc(m.sm)}</td>`:""}<td>${m.ent?`<span class="pill ${entCls(m.ent)}">${esc(m.ent)}</span>`:"—"}</td>
    <td><b>${esc(m.person)||"—"}</b>${m.entity?`<div class="small mute">${esc(m.entity)}</div>`:""}${m.tieup==="Yes"?`<div class="small" style="color:var(--amber)">Tie-up${m.tieupWith?": "+esc(m.tieupWith):""}${m.passback?" · "+esc(m.passback):""}</div>`:""}</td>
    <td class="num" style="white-space:nowrap">${m.phone?`<a href="${telHref(m.phone.split("/")[0])}" class="lnk">${esc(m.phone)}</a>`:"—"}</td>
    <td>${intPill(m.interest)||"—"}${m.willing?`<div class="small mute" style="margin-top:3px">Willing: ${esc(m.willing)}</div>`:""}</td><td>${esc(m.purpose)||"—"}</td><td>${esc(m.outcome)||"—"}</td>
    <td class="small" style="max-width:280px">${[m.remarks,m.feedback].filter(Boolean).map(esc).join("<br>")||'<span class="mute">—</span>'}</td>
    <td style="white-space:nowrap">${canEditMeeting(m)?`<button class="btn sm" data-medit="${esc(m.id)}">✎ Edit</button>`:""}</td></tr>`).join("")||`<tr><td colspan="10"><div class="empty">No field work in this period${all.length?" – try All time or clear the filters":" yet – add your first meeting"}.</div></td></tr>`;
  h+=`</table></div>`;
  h+=`<div class="mcards">${list.map(m=>`<div class="card mcard"><div class="mc-top"><div><b>${esc(m.person)||esc(m.entity)||"—"}</b>${m.person&&m.entity?`<div class="small mute">${esc(m.entity)}</div>`:""}</div>
      ${canEditMeeting(m)?`<button class="btn sm" data-medit="${esc(m.id)}">✎ Edit</button>`:""}</div>
    <div class="mc-tags">${m.ent?`<span class="pill ${entCls(m.ent)}">${esc(m.ent)}</span>`:""}${m.type?`<span class="pill s-new">${esc(m.type)}</span>`:""}${intPill(m.interest)}${m.willing?`<span class="pill ${yesCls(m.willing)}">Willing: ${esc(m.willing)}</span>`:""}</div>
    <div class="small mute">${m.at?fmt(m.at):""}${isLead()&&m.sm?" · "+esc(m.sm):""}</div>
    ${m.phone?`<a class="btn call sm" style="margin-top:8px" href="${telHref(m.phone.split("/")[0])}">📞 ${esc(m.phone)}</a>`:""}
    ${m.purpose||m.outcome?`<div class="small" style="margin-top:8px">${m.purpose?`<b>Purpose:</b> ${esc(m.purpose)}`:""}${m.purpose&&m.outcome?" · ":""}${m.outcome?`<b>Outcome:</b> ${esc(m.outcome)}`:""}</div>`:""}
    ${m.tieup==="Yes"?`<div class="small" style="color:var(--amber);margin-top:4px">Tie-up${m.tieupWith?": "+esc(m.tieupWith):""}${m.passback?" · "+esc(m.passback):""}</div>`:""}
    ${m.remarks||m.feedback?`<div class="small" style="margin-top:6px">${[m.remarks,m.feedback].filter(Boolean).map(esc).join("<br>")}</div>`:""}</div>`).join("")||`<div class="card empty">No field work in this period${all.length?" – try All time or clear the filters":" yet – add your first meeting"}.</div>`}</div>`;
  return h;
}
function bindMeetings(){
  const q=$("#mq");if(q)q.oninput=e=>{view.mq=e.target.value;const p=e.target.selectionStart;render();const n=$("#mq");n.focus();n.setSelectionRange(p,p)};
  [["#mSm","mSm"],["#mEnt","mEnt"],["#mType","mType"],["#mInt","mInt"]].forEach(([s,k])=>{const el=$(s);if(el)el.onchange=()=>{view[k]=el.value;render()}});
  const add=$("#mAdd");if(add)add.onclick=()=>openMeeting(null);
  document.querySelectorAll("[data-medit]").forEach(b=>b.onclick=e=>{e.stopPropagation();openMeeting(b.dataset.medit)});
}
function openMeeting(id){
  const m=id?(S.meetings||[]).find(x=>x.id===id):null;
  const v=k=>esc(m?m[k]:"");
  const dt=m&&m.at?new Date(m.at):new Date();
  const dtv=`${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
  const sel=(id,opts,cur,blank)=>`<select id="${id}" style="width:100%">${blank?`<option value="">${blank}</option>`:""}${opts.map(o=>`<option ${o===cur?"selected":""}>${esc(o)}</option>`).join("")}${cur&&!opts.includes(cur)?`<option selected>${esc(cur)}</option>`:""}</select>`;
  const seg=(k,opts,cur)=>`<div class="seg" data-seg="${k}">${opts.map(t=>`<button type="button" class="${cur===t?"on":""}">${t}</button>`).join("")}</div>`;
  const canPickSm=isLead(),curSm=m?m.sm:(ME?ME.name:"");
  const L=FW_LABEL;
  $("#modal").style.maxWidth="";$("#modal").innerHTML=`<div class="mh"><div><div style="font-weight:700">${m?"Edit field work":"Add field work"}</div>${m?`<div class="small mute">${esc(m.id)} · last updated ${m.updated?fmt(m.updated):"—"}${m.updatedBy?" by "+esc(m.updatedBy):""}</div>`:""}</div><button class="x" id="mx">×</button></div>
  <form id="mfm"><div class="mb mform">
    <div class="g2"><div><label class="f">${L.at}</label><input type="datetime-local" id="m_at" value="${dtv}" style="width:100%"></div>
      <div><label class="f">${L.sm}</label>${canPickSm?sel("m_sm",S.employees.map(e=>e.name),curSm):`<input value="${esc(curSm)}" disabled style="width:100%">`}</div></div>
    <div class="g2"><div><label class="f">${L.type}</label>${seg("m_type",M_TYPES,m?m.type:"Physical")}</div>
      <div><label class="f">${L.ent}</label>${sel("m_ent",M_ENTITY,m?m.ent:"",m?"":"Choose…")}</div></div>
    <label class="f">${L.person} *</label><input id="m_person" value="${v("person")}" placeholder="Person you met, e.g. Rohan" style="width:100%" maxlength="120">
    <div class="g2"><div><label class="f">${L.entity}</label><input id="m_entity" value="${v("entity")}" placeholder="e.g. Vaishnavi Paradise" style="width:100%" maxlength="120"></div>
      <div><label class="f">${L.phone}</label><input id="m_phone" inputmode="tel" value="${v("phone")}" placeholder="98XXX XXXXX" style="width:100%" maxlength="40"></div></div>
    <div class="g2"><div><label class="f">${L.willing}</label>${seg("m_willing",M_YESNO,m?m.willing:"")}</div>
      <div><label class="f">${L.existing}</label><input id="m_exist" value="${v("existing")}" placeholder="e.g. 60% or Not applicable" style="width:100%" maxlength="60"></div></div>
    <div class="g2"><div><label class="f">${L.purpose}</label><input id="m_purpose" value="${v("purpose")}" list="dl_purpose" style="width:100%" maxlength="100"></div>
      <div><label class="f">${L.outcome}</label><input id="m_outcome" value="${v("outcome")}" placeholder="e.g. 1-3 files expected" style="width:100%" maxlength="120"></div></div>
    <label class="f">${L.interest}</label><div class="seg seg-int" data-seg="m_interest">${["Interested","Not interested"].map(t=>`<button type="button" class="${m&&m.interest===t?"on":""}">${t}</button>`).join("")}</div>
    <label class="f">${L.remarks}</label><input id="m_remarks" value="${v("remarks")}" placeholder="e.g. 1 CR business" style="width:100%" maxlength="300">
    <div class="g2"><div><label class="f">${L.tieup}</label>${seg("m_tieup",["Yes","No"],m?m.tieup:"")}</div>
      <div id="tuw"><label class="f">${L.tieupWith}</label><input id="m_tuw" value="${v("tieupWith")}" style="width:100%" maxlength="100"></div></div>
    <label class="f">${L.passback}</label><input id="m_pass" value="${v("passback")}" placeholder="e.g. 50% payout ratio" style="width:100%" maxlength="100">
    <label class="f">${L.feedback}</label><textarea id="m_fb" maxlength="1000" placeholder="What happened, next steps…">${v("feedback")}</textarea>
    <datalist id="dl_purpose">${M_PURPOSE.map(p=>`<option>${p}</option>`).join("")}</datalist>
    <div id="mErr" class="small" style="color:var(--red);margin-top:8px"></div>
  </div><div class="mf">${m&&isMgr()?`<button type="button" class="btn" id="mDel" style="margin-right:auto;color:var(--red)">Delete</button>`:""}<button type="button" class="btn" id="mc">Cancel</button><button class="btn pri" id="mok">${m?"Save changes":"Add field work"}</button></div></form>`;
  $("#mbg").classList.add("show");const close=()=>$("#mbg").classList.remove("show");
  $("#mx").onclick=close;$("#mc").onclick=close;
  const segVal=k=>{const b=document.querySelector(`[data-seg="${k}"] button.on`);return b?b.textContent:""};
  const tuw=()=>{$("#tuw").style.visibility=segVal("m_tieup")==="Yes"?"visible":"hidden"};
  document.querySelectorAll("[data-seg]").forEach(g=>g.querySelectorAll("button").forEach(b=>b.onclick=()=>{const was=b.classList.contains("on");g.querySelectorAll("button").forEach(x=>x.classList.remove("on"));if(!was||g.dataset.seg==="m_type")b.classList.add("on");tuw()}));
  tuw();
  if($("#mDel")){$("#mDel").onclick=async()=>{if(!await askOk({title:"Delete this field work entry?",ok:"Yes, delete",danger:true,body:"This can't be undone."}))return;
    if(await write(api=>api.deleteMeeting(m.id),"Field work entry deleted","Deleting field work entry…"))close()}}
  ["#m_person","#m_entity","#m_tuw"].forEach(s=>{const el=$(s);if(el)el.addEventListener("blur",()=>{el.value=properName(el.value)})});
  ["#m_purpose","#m_outcome","#m_remarks","#m_pass","#m_exist"].forEach(s=>{const el=$(s);if(el)el.addEventListener("blur",()=>{el.value=tidyText(el.value)})});
  $("#m_person").focus();
  $("#mfm").onsubmit=async e=>{e.preventDefault();
    const person=properName($("#m_person").value),entity=properName($("#m_entity").value);
    if(person.length<2&&entity.length<2){$("#mErr").textContent="Enter the name of the person or the entity you met.";return}
    const ph=$("#m_phone").value.trim();if(ph&&ph.replace(/\D/g,"").length<10){$("#mErr").textContent="Contact number looks too short – enter 10 digits or leave it empty.";return}
    const smName=canPickSm?$("#m_sm").value:curSm;const smEmp=S.allEmps.find(x=>x.name===smName);
    const rec={id:m?m.id:"",at:toSheetTime(parseT($("#m_at").value)||Date.now()),sm:smName,smId:smEmp?smEmp.id:(m?m.smId:""),type:segVal("m_type")||"Physical",ent:$("#m_ent").value,
      person,entity,willing:segVal("m_willing"),existing:$("#m_exist").value.trim(),phone:ph,purpose:$("#m_purpose").value.trim(),outcome:$("#m_outcome").value.trim(),interest:segVal("m_interest"),
      remarks:$("#m_remarks").value.trim(),tieup:segVal("m_tieup"),tieupWith:segVal("m_tieup")==="Yes"?$("#m_tuw").value.trim():"",passback:$("#m_pass").value.trim(),feedback:$("#m_fb").value.trim()};
    if(m&&!await askOk({title:"Save changes to this field work entry?",ok:"Yes, save"}))return;
    const b=$("#mok");b.disabled=true;b.innerHTML=`<span class="spin"></span> Saving…`;
    if(await write(api=>api.saveMeeting(rec),m?"Field work updated":"Field work added","Saving field work…"))close();else{b.disabled=false;b.textContent=m?"Save changes":"Add field work"}};
}
function rMeetings(){
  const L=FW_LABEL;
  return [["ID",L.at,L.sm,L.type,L.ent,L.person,L.entity,L.willing,L.existing,L.phone,L.purpose,L.outcome,L.interest,L.remarks,L.tieup,L.tieupWith,L.passback,L.feedback,"Last updated","Updated by"],
    ...(S.meetings||[]).filter(m=>inRange(m.at)).slice().reverse().map(m=>[m.id,T(m.at),m.sm,m.type,m.ent,m.person,m.entity,m.willing,m.existing,m.phone,m.purpose,m.outcome,m.interest,m.remarks,m.tieup,m.tieupWith,m.passback,m.feedback,T(m.updated),m.updatedBy])];
}

   ${can("doAssign")?`<select id="toEmp"><option value="">Assign selected to…</option>${asgOpts()}</select>

/* "Access" column: Full / Role default / Custom (n changes) / Own page */
function accessLabel(e){if(e.role==="Admin")return'<span class="pill" style="background:#e8f0fe;color:var(--brand)">Full access</span>';
  const n=String(e.permRaw||"").split(/[,\s]+/).filter(t=>/^[+-]/.test(t)&&allowedPerms(e.role).includes(t.slice(1))).length;
  if(n)return `<span class="pill" style="background:#fff4e0;color:#b26a00">Custom · ${n} change${n===1?"":"s"}</span>`;
  return rank(e.role)>rank("Team Lead")?`<span class="mute">${e.role==="Sales Manager"?"Own field work page":"Own calling page"}</span>${isCustomRole(e.role)?'<div class="small mute">custom designation</div>':""}`:'<span class="mute">Role default</span>'}
function openPerms(id){const e=emp(id);if(!e||e.role==="Admin")return;const base=new Set(basePerms(e.role)),cur=permsOf(e),AL=allowedPerms(e.role);
  const box=(k,l)=>{const allowed=AL.includes(k);return `<label class="perm ${allowed?"":"off"}"><input type="checkbox" data-pk="${k}" ${cur.has(k)?"checked":""} ${allowed?"":"disabled"}> <span>${esc(l)}</span>${!allowed?`<em>${k==="empEdit"?"Admin / Manager only":"Not for this role"}</em>`:base.has(k)?'<em>default</em>':""}</label>`};
  $("#modal").style.maxWidth="780px";
  $("#modal").innerHTML=`<div class="pmw"><div class="mh"><div><b>Permissions – ${esc(e.name)}</b><div class="small mute">${esc(e.role)} · ticks marked <i>default</i> come with the role</div></div><button class="x" id="mc">✕</button></div>
   <div class="mb">${PERM_DEF.map(([g,items])=>`<div class="pgrp"><div class="small" style="font-weight:700;margin-bottom:6px">${g}</div><div class="pgrid">${items.map(([k,l])=>box(k,l)).join("")}</div></div>`).join("")}
    <div class="pgrp"><div class="small" style="font-weight:700;margin-bottom:6px">Whose data they see</div><div class="pgrid pgrid3">${SCOPE_OPTS.map(([v,l,d])=>`<label class="perm"><input type="radio" name="pscope" value="${v}" ${scopeOf(cur)===v?"checked":""}> <span><b>${l}</b><div class="small mute">${d}</div></span>${scopeOf(base)===v?"<em>default</em>":""}</label>`).join("")}</div>
    ${rank(e.role)>rank("Team Lead")?`<div class="small mute" style="margin-top:10px">Tick any tab above and ${esc(e.name.split(" ")[0])} gets the full CRM layout with those tabs, plus a <b>My ${e.role==="Sales Manager"?"page":"calls"}</b> tab for their usual page.</div>`:""}</div></div>
   <div class="mf pmf"><button class="btn" id="pdef" title="Put back the usual access for a ${esc(e.role)}">↺ Reset to default</button><span class="sp"></span><button class="btn" id="mc2">Cancel</button><button class="btn pri" id="psave">Save permissions</button></div></div>`;
  $("#mbg").classList.add("show");const close=()=>$("#mbg").classList.remove("show");$("#mc").onclick=close;$("#mc2").onclick=close;
  $("#pdef").onclick=()=>{document.querySelectorAll("[data-pk]").forEach(x=>{if(!x.disabled)x.checked=base.has(x.dataset.pk)});document.querySelectorAll("[name=pscope]").forEach(x=>x.checked=x.value===scopeOf(base))};
  $("#psave").onclick=async()=>{const sc=(document.querySelector("[name=pscope]:checked")||{}).value||"own";
    const want=[...document.querySelectorAll("[data-pk]:checked")].map(x=>x.dataset.pk).concat(sc==="all"?["scopeAll"]:sc==="team"?["scopeTeam"]:[]);
    const name=k=>(PERM_DEF.flatMap(g=>g[1]).find(x=>x[0]===k)||[])[1];
    const on=want.filter(k=>!cur.has(k)&&name(k)),off=[...cur].filter(k=>!want.includes(k)&&AL.includes(k)&&name(k));
    const scCh=sc!==scopeOf(cur),scName=v=>SCOPE_OPTS.find(x=>x[0]===v)[1];
    if(!on.length&&!off.length&&!scCh)return toast("Nothing changed");
    if(!await askOk({title:"Change "+e.name+"'s permissions?",ok:"Yes, save",body:`<ul>${on.map(k=>`<li>✅ <b>Allow</b>: ${esc(name(k))}</li>`).join("")}${off.map(k=>`<li>⛔ <b>Remove</b>: ${esc(name(k))}</li>`).join("")}${scCh?`<li>👁 <b>Data they see</b>: ${scName(scopeOf(cur))} → <b>${scName(sc)}</b></li>`:""}</ul><div class="small mute">${esc(e.name.split(" ")[0])} sees the change the next time their CRM refreshes.</div>`}))return;
    const done=btnBusy($("#psave"),"Saving…");if(await write(api=>api.setPerms(e.id,want),"Permissions saved for "+e.name,"Saving permissions for "+e.name+"…"))close();else done()}}
function aTeam(){

   <input id="eName" placeholder="Name (used to log in)" style="flex:2;min-width:150px">

   <select id="eRole">${roleOpts("Telecaller Executive")}</select>

  h+=S.employees.map(e=>{const m=S.leads.filter(l=>l.assignedTo===e.id),cm=canManageRole(e.role)||(ME&&e.id===ME.id),self=ME&&e.id===ME.id;

    <td style="text-align:right;white-space:nowrap">${ME&&ME.role==="Admin"&&e.role!=="Admin"?`<button class="btn sm" data-perm="${esc(e.id)}">🛡 Permissions</button> `:""}${cm?`${can("empEdit")?`<button class="btn sm" data-edit="${esc(e.id)}">Edit</button> `:""}${can("pinReset")||self?`<button class="btn sm" data-pin="${esc(e.id)}">Reset PIN</button>`:""}${self||!can("empEdit")?"":` <button class="btn sm" data-del="${esc(e.id)}">Remove</button>`}`:'<span class="small mute">Admin only</span>'}
    ${canViewAs()?`<button class="btn sm" data-as="${esc(e.id)}">View list</button>`:""}</td></tr>`}).join("");
  return h+`</table></div>`;

const filteredLogs=()=>allLogs().filter(g=>(view.logEmp==="all"||g.by===view.logEmp)&&(view.logOut==="all"||g.outcome===view.logOut));

  const logs=filteredLogs();
  let h=`<div class="card pad" style="margin-bottom:12px"><div class="row">
   <select id="lEmp"><option value="all">Everyone</option>${S.employees.map(e=>`<option value="${esc(e.id)}" ${view.logEmp===e.id?"selected":""}>${esc(e.name)}</option>`).join("")}</select>
   <select id="lOut"><option value="all">All outcomes</option>${Object.entries(OUTCOMES).map(([k,o])=>`<option value="${k}" ${view.logOut===k?"selected":""}>${o.label}</option>`).join("")}</select>
   <span class="spacer"></span><span class="mute small">${logs.length} calls</span><button class="btn" id="copyCsv">⧉ Copy as CSV</button></div></div>
  <div class="card tw"><table><tr><th>Date & time</th><th>Called by</th><th>Customer</th><th>Number</th><th>Outcome</th><th>Remark</th><th>Follow-up</th></tr>`;
  h+=logs.map(g=>`<tr><td class="num small">${fmt(g.at)}</td><td>${esc(empName(g.by))}</td><td><b>${esc(g.lead.name)}</b></td><td class="num">${esc(g.lead.phone)}</td><td>${pill(g.outcome)}</td><td class="small" style="max-width:260px">${esc(g.remark)||'<span class="mute">—</span>'}</td><td class="small num">${g.followUp?fmt(g.followUp):"—"}</td></tr>`).join("")||`<tr><td colspan="7"><div class="empty">No calls logged</div></td></tr>`;

function distributePlan(ids){const E=callers().length?callers():S.employees;const plan={};if(!E.length)return plan;
  const load=Object.fromEntries(E.map(e=>[e.id,S.leads.filter(l=>l.assignedTo===e.id).length]));
  ids.forEach(id=>{const e=E.reduce((a,b)=>load[a.id]<=load[b.id]?a:b);(plan[e.id]=plan[e.id]||[]).push(id);load[e.id]++});return plan}
const validPin=p=>/^\d{4}$/.test(p);
document.addEventListener("input",e=>{const t=e.target;if(t&&/^(lgPin|ePin|fPin|fO|fN1|fN2)$/.test(t.id)){const v=t.value.replace(/\D/g,"").slice(0,4);if(v!==t.value)t.value=v}});
const normName=s=>String(s||"").trim().toLowerCase().replace(/\s+/g," ");
function bindAdmin(){
  const on=(s,ev,fn)=>{const el=$(s);if(el)el[ev]=fn};
  on("#q","oninput",e=>{view.q=e.target.value;const p=e.target.selectionStart;render();const n=$("#q");n.focus();n.setSelectionRange(p,p)});
  if($("#af")){$("#af").value=view.assignFilter;$("#af").onchange=e=>{view.assignFilter=e.target.value;render()}}
  document.querySelectorAll("[data-sel]").forEach(c=>c.onchange=()=>{c.checked?view.sel.add(c.dataset.sel):view.sel.delete(c.dataset.sel);render()});
  on("#all","onchange",e=>{document.querySelectorAll("[data-sel]").forEach(c=>e.target.checked?view.sel.add(c.dataset.sel):view.sel.delete(c.dataset.sel));render()});
  on("#doAssign","onclick",async()=>{const to=$("#toEmp").value;if(!to)return toast("Choose a person first");const ids=[...view.sel];
    if(!await askOk({title:"Assign "+ids.length+" contact"+(ids.length===1?"":"s")+"?",ok:"Yes, assign",body:`${ids.length} selected contact${ids.length===1?"":"s"} will go to <b>${esc(empName(to))}</b> for calling.`}))return;
    const done=btnBusy($("#doAssign"),"Assigning…");if(await write(api=>api.assign(ids,to),`${ids.length} contact(s) assigned to ${empName(to)}`,"Assigning "+ids.length+" contact"+(ids.length===1?"":"s")+" to "+empName(to)+"…")){view.sel.clear();render()}else done()});
  on("#auto","onclick",async()=>{const un=S.leads.filter(l=>!l.assignedTo).map(l=>l.id);if(!un.length)return toast("No unassigned contacts");
    const plan=distributePlan(un);
    if(!await askOk({title:"Share out "+un.length+" contacts?",ok:"Yes, share out",body:`<ul>${Object.entries(plan).map(([eid,ids])=>`<li><b>${esc(empName(eid))}</b>: ${ids.length}</li>`).join("")}</ul>`}))return;
    await write(async api=>{for(const [eid,ids] of Object.entries(plan))await api.assign(ids,eid)},`${un.length} contacts distributed`,"Sharing out "+un.length+" contacts…")});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openLead(b.dataset.open,false));
  on("#addOne","onclick",async()=>{const n=$("#nName").value.trim(),p=$("#nPhone").value.trim();if(!n||!p)return toast("Name and number are required");
    if(isTL()&&!$("#nEmp").value)return toast("Choose who in your team should call this contact");
    await write(api=>api.addLeads([{name:n,phone:p,city:$("#nCity").value.trim(),assignedTo:$("#nEmp").value}]),"Contact added","Adding contact…")});
  on("#doBulk","onclick",async()=>{const lines=$("#bulk").value.split("\n").map(s=>s.trim()).filter(Boolean);const to=$("#bEmp").value;const list=[];
    lines.forEach(ln=>{const p=ln.split(/\t|,/).map(s=>s.trim());if(p.length<2||p[1].replace(/\D/g,"").length<6)return;list.push({name:p[0],phone:p[1],city:p[2]||""})});
    if(!list.length)return toast("No valid lines – use: Name, Number, City");
    if(to==="__auto"){const plan=distributePlan(list.map((_,i)=>i));Object.entries(plan).forEach(([eid,idx])=>idx.forEach(i=>list[i].assignedTo=eid))}else list.forEach(x=>x.assignedTo=to);
    if(!await askOk({title:"Import "+list.length+" contact"+(list.length===1?"":"s")+"?",ok:"Yes, import",body:`${list.length} contact${list.length===1?"":"s"} will be added${to==="__auto"?" and shared out across the team":to?` and assigned to <b>${esc(empName(to))}</b>`:" without an owner"}.${lines.length-list.length?` ${lines.length-list.length} line(s) will be skipped.`:""}`}))return;
    if(await write(api=>api.addLeads(list),`${list.length} contact(s) imported`+(lines.length-list.length?`, ${lines.length-list.length} skipped`:""),"Importing "+list.length+" contacts…")){view.tab="assign";render()}});
  bindRolePick("eRole","eRoleC");
  on("#addEmp","onclick",async()=>{const n=$("#eName").value.trim(),ph=$("#ePhone").value.trim(),pin=$("#ePin").value.trim(),role=pickedRole("eRole","eRoleC"),tl=$("#eTl").value;
    if(role.length<2)return toast("Type the designation (at least 2 letters)");
    if(n.length<2)return toast("Enter a name – it's used to log in");if(ph&&ph.replace(/\D/g,"").length<10)return toast("Mobile must be 10 digits (or leave it empty)");if(!validPin(pin))return toast("First PIN must be 4 digits");
    if(S.employees.some(e=>normName(e.name)===normName(n)))return toast("Someone is already called "+n+" – add a surname or initial");
    await write(api=>api.addEmp({name:n,phone:ph,role,pin,tl:role==="Team Lead"?"":tl}),`${n} added as ${role}`+(tl&&role!=="Team Lead"?` in ${empName(tl)}'s team`:""),"Adding "+n+"…")});
  document.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>openEditEmp(b.dataset.edit));
  document.querySelectorAll("[data-pin]").forEach(b=>b.onclick=()=>openResetPin(b.dataset.pin));
  on("#myPin2","onclick",()=>openChangePin());
  document.querySelectorAll("[data-perm]").forEach(b=>b.onclick=()=>openPerms(b.dataset.perm));
  document.querySelectorAll("[data-del]").forEach(b=>{b.onclick=async()=>{
    if(!await askOk({title:"Remove "+empName(b.dataset.del)+"?",ok:"Yes, remove",danger:true,body:"They can't log in any more and their contacts become unassigned."}))return;
    await write(api=>api.removeEmp(b.dataset.del),"Removed – their contacts are now unassigned","Removing "+empName(b.dataset.del)+"…")}});
  document.querySelectorAll("[data-as]").forEach(b=>b.onclick=()=>{view.who=b.dataset.as;view.tab="my";render()});
  on("#lEmp","onchange",e=>{view.logEmp=e.target.value;render()});
  on("#lOut","onchange",e=>{view.logOut=e.target.value;render()});
  on("#copyCsv","onclick",async()=>{const q=v=>`"${String(v??"").replace(/"/g,'""')}"`;
    const csv=["Date,Called by,Customer,Number,City,Outcome,Remark,Follow-up",...filteredLogs().map(g=>[fmt(g.at),empName(g.by),g.lead.name,g.lead.phone,g.lead.city,OUTCOMES[g.outcome].label,g.remark,g.followUp?fmt(g.followUp):""].map(q).join(","))].join("\n");
    try{await navigator.clipboard.writeText(csv);toast("Copied – paste into Excel")}catch(e){toast("Copy blocked by browser")}});
}

/* ---------- small form modals ---------- */
function formModal(title,body,okLabel,onOk){
  $("#modal").style.maxWidth="";$("#modal").innerHTML=`<div class="mh"><div style="font-weight:700">${title}</div><button class="x" id="mx">×</button></div><form id="mf"><div class="mb">${body}<div id="mErr" class="small" style="color:var(--red);margin-top:8px"></div></div>
   <div class="mf"><button type="button" class="btn" id="mc">Cancel</button><button class="btn pri" id="mok">${okLabel}</button></div></form>`;
  $("#mbg").classList.add("show");const close=()=>$("#mbg").classList.remove("show");
  $("#mx").onclick=close;$("#mc").onclick=close;
  $("#mf").onsubmit=async e=>{e.preventDefault();$("#mErr").textContent="";const b=$("#mok");b.disabled=true;
    const err=await onOk();if(err===true||err===undefined){close()}else{b.disabled=false;if(err)$("#mErr").textContent=err}};
  const f=$("#modal input");if(f)f.focus();
}

   <label class="f">Role / designation</label><select id="fR" style="width:100%" ${self?"disabled":""}>${self?`<option>${esc(e.role)}</option>`:roleOpts(e.role)}</select>
   <input id="fRC" placeholder="Type the designation, e.g. Operations Executive" maxlength="40" style="width:100%;margin-top:6px;display:none">
   <div class="small mute" style="margin-top:4px">A typed designation starts with the basic calling page – use <b>🛡 Permissions</b> to give more access.</div>
   <label class="f">Team Lead</label><select id="fT" style="width:100%"><option value="">No Team Lead</option>${teamLeads().filter(t=>t.id!==e.id).map(t=>`<option value="${esc(t.id)}" ${e.tl===t.id?"selected":""}>${esc(t.name)}</option>`).join("")}</select>
   <div class="small mute" style="margin-top:4px">A Team Lead sees and assigns only their own team. Not used for Team Leads, Managers and Admins.</div>`,"Save",async()=>{
    const name=$("#fN").value.trim(),phone=$("#fP").value.trim(),role=self?e.role:pickedRole("fR","fRC"),tl=rank(role)>rank("Team Lead")?$("#fT").value:"";

    return await write(api=>api.updateEmp({id,name,phone,role,tl}),"Saved","Saving "+name+"…")?true:"Not saved – see the message at the bottom"});bindRolePick("fR","fRC")}
